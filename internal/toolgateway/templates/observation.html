<section id="observation-discovery"></section>
<script>
(() => {
 const v=ArgusView,t=(zh,en)=>v.text(zh,en);
 const placementLabels=()=>({configured_collector_id:t('配置采集器','Configured collector'),effective_collector_id:t('生效采集器','Effective collector'),placement_state:t('采集归属','Collection placement'),source_id:t('来源 ID','Source ID'),source_key:t('版本选择器','Version selector'),config_revision:t('配置修订','Config revision'),current_installation:t('当前 Collector 代际','Current Collector generation')});
 const publicFields=row=>Object.entries(row).filter(([key])=>!['sampling_performed','data_state_reason','entry_kind','installation_scope','query_methods','semantics'].includes(key)).map(([key,value])=>key==='placement_state'?[placementLabels()[key],value==='requires_authorized_resolution'?t('此结果尚未核对主机或集群归属','Host or Cluster placement has not been verified by this result'):value==='unassigned'?t('未分配采集器','No Collector assigned'):value]:key==='data_state'?[t('采样检查','Sample check'),['not_checked','not_sampled'].includes(value)?t('未执行采样检查，请以实际查询为准','Sample check not performed; use actual query evidence'):value]:[placementLabels()[key]||key,value]);
 v.mount(document.getElementById('observation-discovery'),(root,data)=>{
  const title=String(data.tool_title||'').split(' / ');
  v.header(root,title.length>1?t(title[0],title[1]):t('观测目录','Observation discovery'),v.time(data.observed_at));
  v.fields(root,[[t('完整性','Completeness'),data.complete===false?t('结果不完整，请继续查询或检查不可用节','Partial; continue querying or inspect unavailable sections'):t('本次结果完整','Complete for this request')]]);
  if(data.sampling_performed===false&&data.data_state==='not_checked')v.note(root,t('本次能力查询未读取遥测样本；这不代表目标历史数据不存在。','This capability request did not read telemetry samples; it does not prove historical data is absent.'));
  if(data.request_context){const scope=v.section(root,t('本次查询条件','Query scope'));v.fields(scope,v.requestFields(data.request_context));if(data.request_context.cursor)v.note(scope,t('这是上次目录查询的续查页，筛选条件保持一致。','Continuation page for the previous directory query; filters remain unchanged.'));}
  const details=(cell,row)=>{
   if(row.sections){for(const [name,section]of Object.entries(row.sections)){if(name==='next_tools')continue;const label={collection_state:t('采集状态','Collection state'),sources:t('采集来源','Sources'),dashboards:t('适用仪表盘','Suitable dashboards')}[name]||name;const body=v.section(cell,label);v.fields(body,[[t('状态','Status'),section.status],[t('完整性','Complete'),section.complete]]);if(name==='dashboards')v.note(body,t('本节链接分别针对当前单个资源，不是多个资源组合的适用性结论；组合条件请使用仪表盘筛选。','These links describe this individual resource, not applicability for a combined resource set; use dashboard filters for combined conditions.'));if(section.coverage==='collection_instances_only')v.note(body,t('本节仅列采集实例；SDK 接入点和其他来源需另行核对。','This section lists collection instances only; SDK endpoints and other sources need separate checks.'));if(section.entry_kind==='source_version_selectors'){v.fields(body,[[t('本页来源数','Sources on this page'),section.page_source_count],[t('本页版本项数','Version entries on this page'),section.page_entry_count]]);v.note(body,t('本页：'+section.page_source_count+' 个来源，'+section.page_entry_count+' 个版本项。不同修订可共享来源；当前 Collector 代际不表示接入点启用、接收中或健康。','This page: '+section.page_source_count+' '+(section.page_source_count===1?'source':'sources')+', '+section.page_entry_count+' version '+(section.page_entry_count===1?'entry':'entries')+'. Revisions may share a source; current Collector generation does not mean the endpoint is enabled, receiving or healthy.'));}for(const item of section.items||[])v.fields(body,publicFields(item));if(section.next_cursor)v.note(body,t('该节仍有下一页，由 AI 继续查询','This section has another page; ask AI to continue'));}}
   else {v.fields(cell,publicFields(row));if(row.semantics){const m=row.semantics,body=v.section(cell,t('量值语义','Quantity semantics'));v.fields(body,[[t('量值','Quantity'),m.quantity_kind==='ratio'?t('比率','Ratio'):m.quantity_kind],[t('建议展示','Suggested display'),m.recommended_display_transform==='percent'?t('百分比（原值 × 100）','Percent (raw × 100)'):m.recommended_display_transform],[t('定义来源','Definition origin'),t('限定当前来源的内置采集定义','Built-in collection definition for this source')]]);v.note(body,t('原始类型和单位保持不变；此定义不适用于其他来源或任意派生表达式。','Raw type and unit remain unchanged; this definition does not apply to other sources or arbitrary derived expressions.'));}if(row.query_methods){const m=row.query_methods,body=v.section(cell,t('查询方式','Query methods'));v.fields(body,[[t('表示形式','Representation'),({classic_histogram:t('经典直方图','Classic histogram'),native_histogram:t('原生直方图','Native histogram'),summary:t('摘要统计','Summary')}[m.representation]||m.representation)],[t('观测数查询','Observation count query'),m.count_expression],[t('总和查询','Sum query'),m.sum_expression],[t('均值查询','Mean query'),m.mean_expression],[t('观测数单位','Count unit'),m.count_unit],[t('均值单位','Mean unit'),m.mean_unit]]);v.note(body,t('请保持相同来源、标签和时间范围；查询方式不是观测值。经典直方图使用 _count/_sum，原生直方图使用对应函数，不能混用。均值不等于 P95。','Keep the same source, labels and time window; methods are not measurements. Classic histograms use _count/_sum, native histograms use the corresponding functions. Do not mix representations. A mean is not P95.'));}}
  };
  const resourceType=row=>({host:t('主机','Host'),kubernetes_cluster:t('Kubernetes 集群','Kubernetes cluster'),kubernetes_namespace:t('命名空间','Namespace'),application:t('应用','Application'),monitoring_target:t('监控目标','Monitoring target')}[row.type||row.ref?.type]||row.type||row.ref?.type);
  if(Array.isArray(data.items))void v.pages(root,data,(target,rows)=>v.table(target,rows,[[t('名称','Name'),row=>row.name||row.id],[t('类型','Type'),resourceType],[t('环境','Environment'),'environment'],[t('集成','Integrations'),row=>(row.integrations||[]).join(' · ')]],details));
  if(Array.isArray(data.metrics)&&(!data.request_context?.kind||data.request_context.kind==='metrics'||data.metrics.length)){if(!data.metrics.length&&data.complete===false)v.note(root,t('本次未返回可确认的指标，目录检查尚未完成。','No confirmed metrics returned; the catalog check is incomplete.'));else v.table(root,data.metrics,[[t('指标','Metric'),'name'],[t('说明','Description'),'description'],[t('类型','Type'),'type'],[t('单位','Unit'),'unit'],[t('来源','Source'),'source_type'],[t('已观测','Observed'),row=>row.observed?t('是','Yes'):t('未观测','Not observed')]],details);}
  for(const name of ['fields','values','sources'])if(Array.isArray(data[name])&&data[name].length){const section=v.section(root,name);for(const row of data[name]){if(row&&typeof row==='object')v.fields(section,publicFields(row));else v.note(section,String(row));}}
  if(data.has_more)v.note(root,t('仍有后续目录，请继续查询；本页不是全部数据','More catalog pages remain; this page is not the full inventory'));
  v.links(root,data._resource_refs,data.resources);
 });
})();
</script>
