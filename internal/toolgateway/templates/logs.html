<section id="pod-log-view"></section>
<script>
ArgusView.mount(document.getElementById('pod-log-view'),(root,data)=>{
 const v=ArgusView,t=(a,b)=>v.text(a,b);v.header(root,t('Pod 日志','Pod logs'),[data.namespace,data.pod,data.container].filter(Boolean).join(' / '));
 v.fields(root,[[t('集群','Cluster'),data.resources?.find(item=>item.id===data.cluster_id)?.name||data.cluster_id],[t('读取时间','Read time'),v.time(data.observed_at)],[t('字节数','Bytes'),data.bytes],[t('完整性','Completeness'),data.truncated?t('尾部有限结果','Bounded tail'):t('本次请求完整','Complete for this request')]]);
 const lines=data.items||String(data.content||'').split('\n').map((body,index)=>({body,line:index+1}));void v.pages(root,{...data,items:lines},(target,rows)=>v.table(target,rows,[[t('行','Line'),'line'],[t('内容','Content'),'body']],(cell,row)=>cell.append(v.node('pre',row.body,'argus-template-code'))));
});
</script>
