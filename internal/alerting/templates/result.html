<section id="alert-view"></section>
<script>
(() => {
 const v=ArgusView,t=(a,b)=>v.text(a,b),names={firing:['活跃','Firing'],resolved:['恢复','Resolved'],recovering:['恢复防抖中','Recovering'],pending:['待触发','Pending'],closed:['已关闭','Closed'],muted:['静默','Muted'],inhibited:['抑制','Inhibited'],failed:['失败','Failed'],unknown:['未知','Unknown'],accepted:['已受理','Accepted'],normal:['正常','Normal'],no_data:['无数据','No data'],error:['评估失败','Evaluation error'],suppressed:['已抑制','Suppressed']},state=value=>names[value]?t(...names[value]):v.value(value);
 const resources=(data,item)=>(item.resource_ids||[]).map(id=>(data.resources||[]).find(resource=>resource.id===id)?.name||id).join(' · ');
 const rules=(root,spec)=>v.table(root,spec?.rules||[],[[t('规则','Rule'),row=>row.name||row.id],[t('查询表达式','Query expression'),'expression'],[t('条件','Condition'),row=>[row.operator,row.threshold,row.unit].filter(value=>value!==undefined).join(' ')],[t('恢复阈值','Recovery threshold'),'recovery_threshold'],[t('严重性','Severity'),'severity']],(cell,row)=>v.fields(cell,Object.entries(row)));
 names.authorization_denied=['评估权限不足','Evaluation access denied'];
 const members=item=>Array.isArray(item.state?.members)?item.state.members:[],snapshot=s=>s.policy_snapshot?.spec||s.policy_snapshot||{};
 const health=item=>state(item.health||'unknown');
 const retained=item=>item.health!=='normal';
 const validity=item=>item.state?.kind==='health'?t('评估健康事件，无指标观测值','Evaluation health event; no metric observation'):retained(item)?t('保留上次成功评估值；本次评估无有效观测','Retained last successful values; no valid observation from this evaluation'):t('最近成功评估值','Values from the last successful evaluation');
 const combination=mode=>mode==='every'?t('全部规则满足','All rules match'):mode==='any'?t('任一规则满足','Any rule matches'):t('组合模式未识别','Combination mode unknown');
 const memberState=member=>[typeof member.firing==='boolean'?(member.firing?t('已触发','Triggered'):t('未触发','Not triggered')):t('触发判定未知','Trigger unknown'),typeof member.recovering==='boolean'?(member.recovering?t('满足恢复条件','Recovery condition met'):t('未满足恢复条件','Recovery condition not met')):t('恢复判定未知','Recovery unknown')].join(' / ');
 const memberTable=(root,s)=>{
  const spec=snapshot(s),target=v.section(root,t('各规则触发依据','Rule observations'),true);target.dataset.alertMembers='true';
  v.fields(target,[[t('组合模式','Combination'),combination(spec.mode)]]);
  v.table(target,s.members,[[t('规则','Rule'),row=>row.name||row.rule_id],[t('查询表达式','Query expression'),'expression'],[t('实际值','Observed value'),row=>v.number(row.value,row.unit)],[t('触发阈值','Trigger threshold'),row=>{const rule=(spec.rules||[]).find(item=>item.id===row.rule_id);return (rule?.operator?rule.operator+' ':'')+v.number(row.threshold,row.unit);}],[t('恢复阈值','Recovery threshold'),row=>v.number(row.recovery_threshold,row.unit)],[t('触发 / 恢复判定','Trigger / recovery'),memberState],[t('严重性','Severity'),'severity']],(cell,row)=>v.fields(cell,Object.entries(row)));
 };
 const event=(root,item,data)=>{
  const s=item.state||{},composite=members(item).length>0,isHealth=s.kind==='health';
  v.header(root,s.name||s.policy_name||t('告警事件','Alert event'),resources(data,item));
  const status=v.section(root,t('评估与数值有效性','Evaluation and value validity'),true);status.dataset.alertHealth='true';
  v.fields(status,[[t('生命周期','Lifecycle'),state(item.lifecycle)],[t('评估健康','Evaluation health'),health(item)],[t('通知状态','Notification status'),state(s.notification_state||'unknown')],[t('数值有效性','Value validity'),validity(item)],[t('最近成功评估','Last successful evaluation'),s.last_successful_at?v.time(s.last_successful_at):t('未知','Unknown')],[t('最近评估尝试','Last evaluation attempt'),v.time(item.last_evaluated_at)]]);
  if(retained(item)&&!isHealth)v.note(status,t('以下数值和各规则判定来自先前成功评估，不代表本次结果；遥测采样时间未提供。','Values and rule decisions below are retained from a prior successful evaluation, not this attempt; telemetry sample time is unavailable.'));
  v.fields(root,[[t('当时策略 / 版本','Policy at trigger / version'),(s.policy_name||item.policy_id)+' / '+v.value(item.policy_version)],[t('触发规则','Triggered rule'),composite?t('组合规则','Composite rules')+' · '+members(item).length:(s.rule_id&&s.rule_id!=='00000000-0000-0000-0000-000000000000'?s.rule_id:t('未识别','Unknown'))],[t('指标 / 标签','Metric / labels'),[s.metric,v.value(s.labels)].join(' · ')],...(!isHealth?[[composite?t('主规则值 / 阈值','Primary rule value / threshold'):t('触发值 / 阈值','Trigger value / threshold'),v.number(s.value,s.unit)+' / '+v.number(s.threshold,s.unit)],[t('恢复阈值','Recovery threshold'),v.number(s.recovery_threshold,s.unit)]]:[]),[t('开始 / 恢复时间','Started / resolved'),v.time(item.started_at)+' / '+v.time(item.resolved_at)],[t('静默 / 抑制原因','Silence / inhibition reasons'),s.noise_reasons]]);
  if(composite)memberTable(root,s);
  if(s.policy_snapshot){const target=v.section(root,t('触发时策略快照','Policy snapshot at trigger'));rules(target,snapshot(s));v.fields(target,Object.entries(s.policy_snapshot));}else v.note(root,t('未提供策略快照，无法还原完整历史配置。','Policy snapshot unavailable; full historical configuration is unknown.'));
 };
 const policy=(root,item)=>{if(!item){v.note(root,t('当前范围没有数据','No data in this range'));return;}v.header(root,v.name(item));v.fields(root,[[t('配置类型','Configuration type'),item.kind],[t('当前版本','Current version'),item.version],[t('启用 / 评估健康','Enabled / evaluation health'),(typeof item.spec?.enabled==='boolean'?(item.spec.enabled?t('启用','Enabled'):t('停用','Disabled')):'—')+' / '+state(item.health)],[t('最近评估','Last evaluation'),v.time(item.last_evaluated_at)]]);const spec=item.spec||{};if(Array.isArray(spec.rules))rules(root,spec);const target=v.section(root,t('当前配置详情','Current configuration details'),!spec.rules);v.fields(target,Object.entries(spec));};
 v.mount(document.getElementById('alert-view'),(root,data)=>{
  const titles={'alert-events':t('告警事件','Alert events'),'alert-event-detail':t('告警详情','Alert details'),'alert-history':t('告警历史','Alert history'),'alert-notifications':t('告警通知','Alert notifications'),'alert-policy-list':t('告警策略','Alert policies'),'alert-policy-detail':t('策略详情','Policy details'),'alert-settings-list':t('告警配置','Alert configuration')};
  if(v.entry==='change-preview'){v.header(root,data.title||t('变更预览','Change preview'),data.summary);v.fields(root,[[t('状态','Status'),state(data.status)],[t('风险','Risk'),data.risk]]);v.changes(root,data);const target=v.section(root,t('目标与影响','Target and impact'),true);v.fields(target,Object.entries(data.preview||{}));v.note(root,t('使用会话中的确认卡片完成确认、审批和提交。','Use the conversation confirmation card for confirmation, approval and submission.'));return;}
  v.header(root,titles[v.entry]||t('告警查询','Alert query'),t('本次查询范围','Query scope')+' · '+(data.resources||[]).map(resource=>resource.name||resource.id).join(' · '));
  if(v.entry==='alert-event-detail'){if(!data.instance){v.note(root,t('当前范围没有数据','No data in this range'));return;}event(root,data.instance,data);const target=v.section(root,t('事件时间线','Event timeline'),true),timeline=v.node('ol',undefined,'argus-template-timeline');for(const item of data.events||[]){const line=v.node('li',v.time(item.created_at)+' · '+state(item.event_type));line.append(v.node('p',v.value(item.payload)));timeline.append(line);}target.append(timeline);}
  else if(v.entry==='alert-policy-detail')policy(root,data.configuration);
  else{const notifications=v.entry==='alert-notifications',policies=v.entry.includes('policy')||v.entry.includes('settings');const columns=notifications?[[t('通知内容','Notification content'),row=>row.message?.subject||row.id],[t('正文','Body'),row=>row.message?.text],[t('状态','Status'),row=>state(row.status)],[t('通道 / 尝试','Channel / attempt'),row=>row.channel_id+' / '+row.attempt],[t('错误','Error'),'last_error']]:policies?[[t('名称','Name'),row=>row.name||row.id],[t('类型','Type'),'kind'],[t('规则数','Rules'),row=>row.spec?.rules?.length??'—'],[t('版本','Version'),'version'],[t('评估健康','Evaluation health'),row=>state(row.health)]]:[[t('策略 / 告警内容','Policy / alert content'),row=>row.state?.policy_name||row.state?.name||row.policy_id],[t('资源','Resources'),row=>resources(data,row)],[t('指标','Metric'),row=>members(row).length?members(row).map(member=>member.name||member.expression).join(' · '):row.state?.metric],[t('数值 / 阈值','Value / threshold'),row=>row.state?.kind==='health'?t('不适用（健康事件）','Not applicable (health event)'):members(row).length?members(row).length+' '+t('条规则，展开查看实际值','rules; expand for observed values'):v.number(row.state?.value,row.state?.unit)+' / '+v.number(row.state?.threshold,row.state?.unit)],[t('状态','Status'),row=>state(row.lifecycle)],[t('开始时间','Started'),row=>v.time(row.started_at)]];
   if(!notifications&&!policies){columns.splice(5,0,[t('评估健康 / 数值','Evaluation health / values'),row=>health(row)+' · '+validity(row)]);}
   void v.pages(root,data,(target,rows)=>v.table(target,rows,columns,(cell,row)=>{if(policies)policy(cell,row);else if(notifications){v.fields(cell,Object.entries(row));}else event(cell,row,data);}));
  }
  if(data.page?.evaluations?.length){const target=v.section(root,t('评估健康与最近成功时间','Evaluation health and freshness'));v.table(target,data.page.evaluations,[[t('策略','Policy'),'name'],[t('健康','Health'),row=>state(row.health)],[t('最近评估','Last evaluation'),row=>v.time(row.last_evaluated_at)],[t('最近成功','Last successful'),row=>v.time(row.last_successful_at)],[t('错误','Error'),'error_code']]);}
  if(data.page&&!data.page.complete)v.note(root,t('这里只读取本次工具封存的结果；还有未查询的业务页，请让 AI 继续查询。','This card reads this tool’s sealed results; ask AI to query additional business pages.'));
 },v.entry==='change-preview'?'result.detail':'alert.details');
})();
</script>
