name: Portable development gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
        description: Include the complete shared portal browser matrix
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Keep the checkout stable during local Git clones
        run: |
          git config --local gc.auto 0
          git config --local maintenance.auto false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: go run ./cmd/argus-dev doctor portable --output json
      - run: go test ./internal/app/argusdev ./internal/app/argusctl ./cmd/argus-dev
      - run: go run ./cmd/argus-dev contracts lint
      - run: go run ./cmd/argus-dev contracts check
      - run: go run ./cmd/argus-dev check query-parsers
      - run: go run ./cmd/argus-dev check installers
      - run: go run ./cmd/argus-dev check tls-security
      - if: runner.os == 'Linux'
        run: go run ./cmd/argus-dev check guacd
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: pnpm test
      - if: runner.os == 'Linux'
        run: pnpm lint
      - run: go run ./cmd/argus-dev web build --api-mode mock
      - run: go run ./cmd/argus-dev web build --api-mode real
      - run: go run ./cmd/argusctl plan --config deploy/profiles/evaluation.yaml --output json
      - run: helm lint deploy/helm/argus-foundation
      - run: helm lint deploy/helm/argus-data-operators
      - run: helm lint deploy/helm/argus-data
      - name: Lint sandbox with authoritative argusctl install values
        run: go test ./internal/app/argusctl -run '^TestSandboxChartLint$' -count=1
      - run: helm lint deploy/helm/argus-platform
      - run: helm lint deploy/helm/argus-telemetry-pipeline
      - run: helm lint tests/e2e/helm/argus-e2e-fixtures
      - run: helm template argus-e2e tests/e2e/helm/argus-e2e-fixtures
      - run: git diff --check

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 60 || 30 }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus_ci
          POSTGRES_PASSWORD: ci-only-public-password
          POSTGRES_DB: argus_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U argus_ci" --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      ARGUS_DATABASE_URL: postgres://argus_ci:ci-only-public-password@127.0.0.1:5432/argus_ci?sslmode=disable
      ARGUS_TEST_DATABASE_URL: postgres://argus_ci:ci-only-public-password@127.0.0.1:5432/argus_ci?sslmode=disable
      ARGUS_P5_TEST_DATABASE_URL: postgres://argus_ci:ci-only-public-password@127.0.0.1:5432/argus_ci?sslmode=disable
      ARGUS_DASHBOARD_TEST_DATABASE_URL: postgres://argus_ci:ci-only-public-password@127.0.0.1:5432/argus_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify actual PostgreSQL migration and generated statements
        run: |
          go test ./tests/postgres -run '^TestMigrations$' -count=1 -timeout=15m
          go run ./cmd/argus-migrate up
          go test ./tests/postgres -run '^TestGeneratedQueriesPrepareAgainstMigratedBaseline$' -count=1
      - name: Verify persisted Agent, authorization and dashboard behavior
        run: go test -p 1 ./internal/agent ./internal/conversation ./internal/dashboard ./internal/authorization -count=1 -timeout=20m
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify critical shared portal browser flows
        if: ${{ !inputs.full }}
        run: pnpm --filter @argus/enterprise exec playwright test enterprise.spec.ts p4.spec.ts p5-mock.spec.ts p5-profile.spec.ts m8-local.spec.ts telemetry-permissions.spec.ts --workers=2 --retries=0
      - name: Verify the complete shared portal browser matrix
        if: inputs.full
        run: pnpm --filter @argus/enterprise exec playwright test --workers=4 --retries=0
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: argus-portal-browser-${{ github.run_id }}
          path: web/apps/enterprise/test-results
          if-no-files-found: ignore

  ci-gate:
    name: CI
    if: ${{ always() }}
    needs: ["portable", "integration"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          optional = set([])
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in jobs.items()
              if job["result"] != "success"
              and not (name in optional and job["result"] == "skipped")
          }
          if failed:
              print(f"Required CI jobs did not succeed: {failed}")
              sys.exit(1)
          print("All mandatory CI jobs passed.")
          PY
