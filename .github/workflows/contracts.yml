name: Contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep the checkout stable during local Git clones
        run: |
          git config --local gc.auto 0
          git config --local maintenance.auto false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: make contract-lint
      - run: make contract-check
      - run: make contract-breaking
      - run: go test ./internal/gen/...
      - run: pnpm --filter @argus/api-client typecheck
