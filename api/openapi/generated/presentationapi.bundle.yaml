openapi: 3.1.0
info:
  title: Argus presentationapi
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /conversations/{conversation_id}/tool-presentations/{tool_call_id}:
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tool_call_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getToolPresentation
      summary: getToolPresentation.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolPresentation'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{conversation_id}/tool-presentations/{tool_call_id}/read:
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tool_call_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: readToolPresentation
      summary: Read a capability bound to this authorized presentation.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationReadInput'
      responses:
        '200':
          description: Bound public presentation data. A result.page response includes matched total, original source_total, offset, complete and low-cardinality public facets. Counts describe this sealed result, not unqueried business data. Filters never execute a new business query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationReadResult'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    ToolPresentation:
      type: object
      additionalProperties: false
      required:
        - tool_call_id
        - runtime
        - template_hash
        - template_source
        - detail_data
        - status
      properties:
        tool_call_id:
          type: string
          format: uuid
        runtime:
          type: string
          enum:
            - argus-template/v1
            - argus-template/v2
        read_operations:
          type: array
          items:
            type: string
        template_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        template_source:
          type: string
          maxLength: 262144
        detail_data:
          type: object
          additionalProperties: true
        resource_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - id
            properties:
              type:
                type: string
                enum:
                  - host
                  - kubernetes_cluster
                  - connector
                  - dashboard
              id:
                type: string
                format: uuid
        result_refs:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - ready
            - failed
    PresentationReadInput:
      type: object
      additionalProperties: false
      required:
        - operation
        - parameters
      properties:
        operation:
          type: string
          enum:
            - resources.context
            - metric.context
            - alert.details
            - dashboard.result
            - result.page
            - runtime.status
            - result.detail
        parameters:
          type: object
          additionalProperties: true
          description: result.page reads sealed data only. Search, exact scalar filters and ordering apply before pagination to the entire bound collection; the cursor binds these conditions and the original presentation/attempt/authorization version. Nested sample slices do not accept filtering. Other operations retain their own parameter allowlists.
          properties:
            search:
              type: string
              maxLength: 256
            filters:
              type: object
              additionalProperties:
                type: string
                maxLength: 256
              description: 'Allowed fields: status, connection_status, severity, level, environment, namespace, resource_type, service_name, signal, type.'
            sort:
              type: string
              enum:
                - ''
                - name
                - title
                - hostname
                - id
                - status
                - severity
                - namespace
                - environment
                - updated_at
                - created_at
                - started_at
                - timestamp
            direction:
              type: string
              enum:
                - asc
                - desc
    PresentationReadResult:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum:
            - ready
            - pending
        data:
          type: object
          additionalProperties: true
        next_cursor:
          type: string
  responses:
    Error:
      description: Stable Argus error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
