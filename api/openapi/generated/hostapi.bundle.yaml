openapi: 3.1.0
info:
  title: Argus Host API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /enterprise/hosts/name-availability:
    get:
      operationId: checkHostNameAvailability
      summary: Check a creation name using host.manage permission without disclosing the occupying resource.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Current name availability. Deleted records do not occupy a name; the name is not reserved.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNameAvailability'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts:
    get:
      operationId: listHosts
      summary: List explicitly authorized Hosts.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: control_path
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HostControlPath'
        - name: bastion_scope_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: labels
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Host page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPage'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getHost
      summary: Get an explicitly authorized Host.
      responses:
        '200':
          description: Host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts/actions/preview-create:
    post:
      operationId: previewCreateHost
      summary: Freeze a validated Host creation plan.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostPreviewCreate'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts/{id}/actions/preview-retry:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewRetryHost
      summary: Preview a new SSH installation attempt for a failed unregistered Host.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostPreviewCreate'
      responses:
        '201':
          description: Installation retry preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts/{id}/actions/preview-update:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewUpdateHost
      summary: Freeze a Host metadata, labels, or path update.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostPreviewUpdate'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts/{id}/actions/preview-delete:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewDeleteHost
      summary: Freeze a Host logical deletion plan.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePreviewDelete'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts/connection-tests:
    post:
      operationId: createHostConnectionTest
      summary: Start a bounded Host connection test.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostConnectionTestCreate'
      responses:
        '202':
          description: Connection Test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTest'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/host-onboarding-operations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getHostOnboardingOperation
      summary: Get a durable Host Connector onboarding operation.
      responses:
        '200':
          description: Host onboarding operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostOnboardingOperation'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/host-removals/connection-defaults:
    get:
      operationId: getHostRemovalConnectionDefaults
      summary: Read SSH account and credential references from the current installation.
      parameters:
        - name: target_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HostRemovalTargetType'
        - name: target_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: expected_version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Non-secret SSH defaults. A fresh connection test is still required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRemovalConnectionDefaults'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/host-removals/actions/preview:
    post:
      operationId: previewHostRemoval
      summary: Freeze a fenced Host or Bastion removal plan.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostRemovalPreview'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/host-removal-operations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getHostRemovalOperation
      summary: Get a durable Host or Bastion removal operation.
      responses:
        '200':
          description: Removal operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRemovalOperation'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/host-removal-operations/{id}/actions/retry:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: retryHostRemovalOperation
      summary: Resume a failed or cleanup-unknown removal from its first unverified step.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Removal operation queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRemovalOperation'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/host-removal-operations/{id}/actions/regenerate-command:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: regenerateHostRemovalCommand
      summary: Rotate the one-time token and return a replacement command for the same removal operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: One-time removal instruction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRemovalInstruction'
        default:
          $ref: '#/components/responses/Error'
  /host-removal/bootstrap-script:
    get:
      operationId: getHostRemovalBootstrapScript
      summary: Claim a one-time removal token and download the target-specific strict-TLS uninstaller.
      security: []
      parameters:
        - name: operation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Argus-Removal-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 256
      responses:
        '200':
          description: Removal script.
          content:
            text/x-shellscript:
              schema:
                type: string
            text/x-powershell:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /host-removal/receipt:
    post:
      operationId: submitHostRemovalReceipt
      summary: Submit an operation-scoped local cleanup receipt after the Connector has stopped.
      security: []
      parameters:
        - name: X-Argus-Removal-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostRemovalReceipt'
      responses:
        '200':
          description: Reconciled removal operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRemovalOperation'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/hosts/{id}/windows-rdp/actions/preview-enable:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewEnableHostWindowsRDP
      summary: Preview the registry, NLA, service, and firewall changes required to enable RDP.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePreviewDelete'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
    Host:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - name
        - address
        - port
        - platform
        - role
        - control_path
        - environment
        - labels
        - labels_version
        - resource_version
        - connection_status
        - status
        - onboarding
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        hostname:
          type: string
          maxLength: 253
        address:
          type: string
          minLength: 0
          maxLength: 512
          description: Connector 注册前可以为空，注册后由可信 enrollment 回填
        port:
          type: integer
          minimum: 0
          maximum: 65535
        platform:
          type: string
          enum:
            - linux
            - windows
        architecture:
          type: string
          enum:
            - amd64
            - arm64
          readOnly: true
          description: 连接测试探测的目标架构(uname -m 归一化),Linux 连接测试必须成功识别架构,Collector 安装按此选择签名产物
        role:
          $ref: '#/components/schemas/HostRole'
        control_path:
          $ref: '#/components/schemas/HostControlPath'
        bastion_scope_id:
          type: string
          format: uuid
        connector_id:
          type: string
          format: uuid
        runtime:
          $ref: '#/components/schemas/HostRuntimeObservation'
          readOnly: true
        environment:
          $ref: '#/components/schemas/Environment'
        labels:
          $ref: '#/components/schemas/Labels'
        labels_version:
          type: integer
          format: int64
          minimum: 1
        resource_version:
          type: integer
          format: int64
          minimum: 1
        connection_status:
          type: string
          enum:
            - online
            - offline
            - onboarding
            - degraded
            - unknown
        pinned_host_key:
          type: string
          maxLength: 512
        last_seen_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - active
            - disabled
            - draining
            - uninstalling
            - uninstalled
            - removal_failed
            - cleanup_unknown
            - deleted
        removal_generation:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        local_cleanup:
          type: string
          enum:
            - verified
            - pending
            - unknown
          readOnly: true
        removal_operation_id:
          type: string
          format: uuid
          readOnly: true
        onboarding:
          $ref: '#/components/schemas/OnboardingProjection'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HostPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        page:
          $ref: '#/components/schemas/CursorPage'
    HostPreviewCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - platform
        - role
        - control_path
        - install_method
        - ssh_path
        - environment
        - labels
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        hostname:
          type: string
          maxLength: 253
        address:
          type: string
          minLength: 0
          maxLength: 512
          description: manual 不填写；ssh 必填
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: manual 为 0；ssh 必填
        platform:
          type: string
          enum:
            - linux
            - windows
        role:
          type: string
          const: managed_host
        control_path:
          $ref: '#/components/schemas/HostControlPath'
        install_method:
          $ref: '#/components/schemas/HostInstallMethod'
        ssh_path:
          $ref: '#/components/schemas/HostSSHPath'
        bastion_scope_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
          description: ssh 模式必填
        username:
          type: string
          minLength: 0
          maxLength: 256
          description: ssh 模式必填
        architecture:
          type: string
          enum:
            - amd64
            - arm64
          description: manual 由用户选择；ssh 由连接测试探测
        environment:
          $ref: '#/components/schemas/Environment'
        labels:
          $ref: '#/components/schemas/UserLabels'
        connection_test_id:
          type: string
          format: uuid
          description: ssh 模式必填
    HostPreviewUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        hostname:
          type: string
          maxLength: 253
        environment:
          $ref: '#/components/schemas/Environment'
        labels:
          $ref: '#/components/schemas/UserLabels'
        expected_version:
          type: integer
          format: int64
          minimum: 1
    ConnectionTest:
      type: object
      additionalProperties: false
      required:
        - id
        - enterprise_id
        - target_type
        - path
        - status
        - checks
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
          readOnly: true
        target_type:
          type: string
          enum:
            - host
            - kubernetes_cluster
        resource_id:
          type: string
          format: uuid
        path:
          type: string
          enum:
            - connector
            - direct
            - in_cluster
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - result_unknown
            - expired
        checks:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - status
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 128
              status:
                type: string
                enum:
                  - passed
                  - failed
                  - skipped
              detail:
                type: string
                maxLength: 1024
        latency_ms:
          type: integer
          minimum: 0
        resolved_ips:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
        host_key_fingerprint:
          type: string
          maxLength: 512
        remote_version:
          type: string
          maxLength: 128
        platform:
          type: string
          enum:
            - linux
            - windows
        architecture:
          type: string
          enum:
            - amd64
            - arm64
        distribution_version:
          type: string
          minLength: 1
          maxLength: 256
        service_manager:
          type: string
          enum:
            - systemd
            - windows_scm
        privileged:
          type: boolean
        free_disk_bytes:
          type: integer
          format: int64
          minimum: 0
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HostOnboardingOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - host_id
        - connector_id
        - install_method
        - ssh_path
        - target_platform
        - control_path
        - stage
        - status
        - attempts
        - max_attempts
        - events
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
        connector_id:
          type: string
          format: uuid
        retry_of:
          type: string
          format: uuid
        release_version_id:
          type: string
          format: uuid
        connection_test_id:
          type: string
          format: uuid
        install_method:
          type: string
          enum:
            - manual
            - ssh
        ssh_path:
          type: string
          enum:
            - none
            - direct_executor
            - bastion_connector
        target_platform:
          type: string
          enum:
            - linux_amd64
            - linux_arm64
            - windows_amd64
        control_path:
          $ref: '#/components/schemas/HostControlPath'
        bastion_scope_id:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - queued
            - probing
            - transferring
            - installing
            - enrolling
            - waiting_online
            - completed
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - result_unknown
            - expired
            - cancelled
        attempts:
          type: integer
          minimum: 0
          maximum: 3
        max_attempts:
          type: integer
          minimum: 1
          maximum: 3
        connector_online_at:
          type: string
          format: date-time
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        events:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/HostOnboardingOperationEvent'
        completed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HostRemovalConnectionDefaults:
      type: object
      additionalProperties: false
      required:
        - username
        - status
      properties:
        username:
          type: string
        status:
          type: string
          enum:
            - available
            - credential_unavailable
            - unavailable
            - not_applicable
        credential_id:
          type: string
          format: uuid
        credential_name:
          type: string
    HostRemovalPreview:
      type: object
      additionalProperties: false
      required:
        - target_type
        - target_id
        - expected_version
        - mode
      properties:
        target_type:
          $ref: '#/components/schemas/HostRemovalTargetType'
        target_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 1
        mode:
          $ref: '#/components/schemas/HostRemovalMode'
        connection_test_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        confirmation_name:
          type: string
          minLength: 1
          maxLength: 128
          description: mode=forget 时必须与资源当前名称完全一致
    HostRemovalOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - target_type
        - target_id
        - connector_id
        - mode
        - delivery_method
        - ssh_path
        - target_platform
        - status
        - stage
        - attempt
        - max_attempts
        - local_cleanup
        - events
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        target_type:
          $ref: '#/components/schemas/HostRemovalTargetType'
        target_id:
          type: string
          format: uuid
        connector_id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/HostRemovalMode'
        delivery_method:
          type: string
          enum:
            - manual
            - ssh
            - server_only
        ssh_path:
          $ref: '#/components/schemas/HostSSHPath'
        target_platform:
          type: string
          enum:
            - linux_amd64
            - linux_arm64
            - windows_amd64
        status:
          $ref: '#/components/schemas/HostRemovalStatus'
        stage:
          $ref: '#/components/schemas/HostRemovalStage'
        attempt:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        local_cleanup:
          type: string
          enum:
            - pending
            - verified
            - unknown
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        events:
          type: array
          items:
            $ref: '#/components/schemas/HostRemovalOperationEvent'
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HostRemovalInstruction:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - platform
        - shell
        - privilege
        - command
        - expires_at
      properties:
        operation_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
            - linux
            - windows
        shell:
          type: string
          enum:
            - posix_sh
            - powershell
        privilege:
          type: string
          const: system
        command:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        expires_at:
          type: string
          format: date-time
    HostRemovalReceipt:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - removal_generation
        - connector_id
        - stage
        - local_cleanup
        - result_hash
        - evidence
      properties:
        operation_id:
          type: string
          format: uuid
        removal_generation:
          type: integer
          format: int64
          minimum: 1
        connector_id:
          type: string
          format: uuid
        stage:
          $ref: '#/components/schemas/HostRemovalStage'
        local_cleanup:
          type: string
          const: verified
        result_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        evidence:
          $ref: '#/components/schemas/HostRemovalCleanupEvidence'
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
    HostRuntimeObservation:
      type: object
      additionalProperties: false
      required:
        - platform
        - openssh_status
        - rdp_status
        - rdp_nla_enabled
        - rdp_firewall_enabled
        - rdp_service_running
        - observed_at
      properties:
        platform:
          type: string
          enum:
            - linux
            - windows
        openssh_status:
          type: string
          enum:
            - available
            - unavailable
            - unknown
        rdp_status:
          type: string
          enum:
            - enabled
            - disabled
            - unavailable
            - unknown
        rdp_nla_enabled:
          type: boolean
        rdp_firewall_enabled:
          type: boolean
        rdp_service_running:
          type: boolean
        observed_at:
          type: string
          format: date-time
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    ResourceNameAvailability:
      type: object
      additionalProperties: false
      required:
        - available
      properties:
        available:
          type: boolean
          description: Whether the name can currently be used for creation in the authenticated enterprise. This does not reserve the name.
    HostControlPath:
      type: string
      enum:
        - direct
        - bastion_relay
        - executor_tunnel
    HostRole:
      type: string
      enum:
        - managed_host
        - bastion
    Environment:
      type: string
      enum:
        - development
        - staging
        - production
    UserLabelKey:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
    SystemLabelKey:
      type: string
      maxLength: 72
      pattern: ^argus\.io/[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
      readOnly: true
    LabelValue:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9](?:[a-z0-9._-]{0,61}[a-z0-9])?$
    Labels:
      type: object
      maxProperties: 64
      propertyNames:
        anyOf:
          - $ref: '#/components/schemas/UserLabelKey'
          - $ref: '#/components/schemas/SystemLabelKey'
      additionalProperties:
        $ref: '#/components/schemas/LabelValue'
    HostInstallMethod:
      type: string
      enum:
        - manual
        - ssh
    HostSSHPath:
      type: string
      enum:
        - none
        - direct_executor
        - bastion_connector
    OnboardingProjection:
      type: object
      additionalProperties: false
      required:
        - state
        - updated_at
      properties:
        state:
          type: string
          enum:
            - command_available
            - command_consumed
            - command_expired
            - awaiting_approval
            - installing
            - install_failed
            - registered
        pending_action_ref:
          type: string
          minLength: 1
          maxLength: 128
        execution_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        error_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        install_method:
          $ref: '#/components/schemas/HostInstallMethod'
          readOnly: true
        ssh_path:
          $ref: '#/components/schemas/HostSSHPath'
          readOnly: true
        updated_at:
          type: string
          format: date-time
    PartialMetadata:
      type: object
      additionalProperties: false
      required:
        - partial
        - reasons
      properties:
        partial:
          type: boolean
        reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - authorization_filtered
              - budget_truncated
              - source_timeout
              - source_unavailable
    CursorPage:
      type: object
      additionalProperties: false
      required:
        - next_cursor
        - has_more
        - partial
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
        partial:
          $ref: '#/components/schemas/PartialMetadata'
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
    UserLabels:
      type: object
      maxProperties: 64
      propertyNames:
        $ref: '#/components/schemas/UserLabelKey'
      additionalProperties:
        $ref: '#/components/schemas/LabelValue'
    PublicJsonValue:
      x-argus-typescript-type: unknown
      oneOf:
        - type: 'null'
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/PublicJsonValue'
        - $ref: '#/components/schemas/PublicJsonObject'
    PublicJsonObject:
      x-argus-typescript-type: unknown
      type: object
      propertyNames:
        allOf:
          - pattern: ^[a-z][a-z0-9_]*$
          - not:
              pattern: (^|_)(argus__token|token|secret|credential|private_params?|commit_tool|remote_access_ticket)($|_)
      additionalProperties:
        $ref: '#/components/schemas/PublicJsonValue'
    pending-action-public.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://argus.io/schemas/v1/action/pending-action-public.schema.json
      title: PendingActionPublic
      type: object
      additionalProperties: false
      required:
        - schema_version
        - action_ref
        - action_type
        - title
        - summary
        - risk
        - preview
        - diff
        - status
        - available_actions
        - expires_at
        - created_at
        - updated_at
      properties:
        schema_version:
          const: argus.pending_action/v1
        action_ref:
          type: string
          minLength: 1
        action_type:
          type: string
          minLength: 3
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 256
        summary:
          type: string
          minLength: 1
          maxLength: 4096
        risk:
          enum:
            - read
            - write
            - dangerous
            - critical
        preview:
          $ref: '#/components/schemas/PublicJsonObject'
        diff:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required:
              - kind
              - text
            properties:
              kind:
                enum:
                  - add
                  - remove
                  - change
                  - note
              text:
                type: string
                maxLength: 2048
        status:
          enum:
            - prepared
            - awaiting_confirmation
            - awaiting_approval
            - ready
            - executing
            - succeeded
            - failed
            - result_unknown
            - cancelled
            - expired
            - rejected
            - invalidated
        available_actions:
          type: array
          uniqueItems: true
          items:
            enum:
              - confirm
              - cancel
              - approve
              - reject
        approval:
          type: object
          additionalProperties: false
          required:
            - required
            - minimum_approvers
            - approved_count
            - separation_of_duty
          properties:
            required:
              type: boolean
            policy_ref:
              type: string
            minimum_approvers:
              type: integer
              minimum: 0
            approved_count:
              type: integer
              minimum: 0
            separation_of_duty:
              type: boolean
        execution_ref:
          type: string
          minLength: 1
        result_summary:
          type: string
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ResourcePreviewDelete:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
    HostConnectionTestCreate:
      type: object
