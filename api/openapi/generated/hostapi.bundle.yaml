        - terminating_sessions
        - awaiting_manual_execution
        - uninstalling_workloads
        - stopping_relay
        - uninstalling_connector
        - verifying_cleanup
        - revoking_identities
        - completed
    HostRemovalOperationEvent:
      type: object
      additionalProperties: false
