          $ref: '#/components/schemas/DashboardDrilldownTimeWindow'
      required:
        - id
        - title
        - detail_query_ref
        - scope_policy
        - inputs
        - origin_query_ref
    DashboardRectangle:
      type: object
      additionalProperties: false
      properties:
        x:
          type: integer
          format: int64
        'y':
          type: integer
          format: int64
        w:
          type: integer
          format: int64
          description: Width in grid columns; at least min_w and x+w must be <=12.
          example: 12
        h:
          type: integer
          format: int64
          description: Height in grid rows; at least min_h, at most 1000.
          example: 32
        min_w:
          type: integer
          format: int64
          description: Minimum width, at least 1.
          example: 3
        min_h:
          type: integer
          format: int64
          description: Minimum height, at least 1.
          example: 12
      required:
        - x
        - 'y'
        - w
        - h
        - min_w
        - min_h
    DashboardThreshold:
      type: object
      additionalProperties: false
      properties:
        value:
          type: number
          format: double
