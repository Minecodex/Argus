openapi: 3.1.0
info:
  title: Argus dashboardapi
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /dashboards:
    get:
      operationId: listDashboards
      summary: listDashboards.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardItem'
        default:
          $ref: '#/components/responses/Error'
  /dashboards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDashboard
      summary: getDashboard.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDetail'
        default:
          $ref: '#/components/responses/Error'
  /dashboards/{id}/revisions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listDashboardRevisions
      summary: listDashboardRevisions.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardRevision'
        default:
          $ref: '#/components/responses/Error'
  /dashboard-drafts:
    get:
      operationId: listDashboardDrafts
      summary: listDashboardDrafts.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardDraft'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDashboardDraft
      summary: createDashboardDraft.
      responses:
        '201':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraft'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardDraftInput'
  /dashboard-drafts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDashboardDraft
      summary: getDashboardDraft.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraft'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: saveDashboardDraft
      summary: saveDashboardDraft.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraft'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardDraftInput'
    delete:
      operationId: discardDashboardDraft
      summary: discardDashboardDraft.
      responses:
        '204':
          description: Operation completed.
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardVersionInput'
  /dashboard-drafts/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: previewDashboardPublication
      summary: previewDashboardPublication.
      responses:
        '201':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardVersionInput'
  /dashboard-drafts/{id}/rebase:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rebaseDashboardDraft
      summary: rebaseDashboardDraft.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraft'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardRebaseInput'
  /dashboard-spec/validate:
    post:
      operationId: validateDashboardSpec
      summary: validateDashboardSpec.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardValidationReport'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardSpec'
  /dashboard-folders:
    get:
      operationId: listDashboardFolders
      summary: List dashboard folders.
      responses:
        '200':
          description: Folders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardFolder'
        default:
          $ref: '#/components/responses/Error'
  /dashboard-folders/preview:
    post:
      operationId: previewDashboardFolder
      summary: Preview a folder change without publishing it.
      responses:
        '201':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardLifecycleInput'
  /dashboards/{id}/actions/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: previewDashboardLifecycle
      summary: Preview dashboard archive or restore.
      responses:
        '201':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardLifecycleInput'
  /dashboards/{id}/execute:
    post:
      operationId: executeDashboard
      summary: executeDashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardExecutionInput'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardExecution'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /dashboard-drafts/{id}/sample:
    post:
      operationId: sampleDashboardDraft
      summary: sampleDashboardDraft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardDraftSampleInput'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraftSample'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /dashboards/catalog/query:
    post:
      operationId: queryDashboardCatalog
      summary: queryDashboardCatalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardCatalogInput'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardCatalogResult'
        default:
          $ref: '#/components/responses/Error'
  /dashboards/{id}/drilldown:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: executeDashboardDrilldown
      summary: executeDashboardDrilldown.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardDrilldownInput'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDrilldownExecution'
        default:
          $ref: '#/components/responses/Error'
  /dashboard-drafts/{id}/drilldowns/generate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateDashboardDrilldowns
      summary: generateDashboardDrilldowns.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardGenerateDrilldownsInput'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardGeneratedDrilldowns'
        default:
          $ref: '#/components/responses/Error'
  /hosts/{id}/dashboard-bindings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listHostDashboardBindings
      summary: List authorized active dashboard shortcuts.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDashboardBindings'
        default:
          $ref: '#/components/responses/Error'
  /hosts/{id}/dashboard-bindings/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: previewHostDashboardBinding
      summary: Preview a resource dashboard binding change.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardBindingInput'
      responses:
        '201':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /kubernetes/clusters/{id}/dashboard-bindings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listClusterDashboardBindings
      summary: List authorized active dashboard shortcuts.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDashboardBindings'
        default:
          $ref: '#/components/responses/Error'
  /kubernetes/clusters/{id}/dashboard-bindings/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: previewClusterDashboardBinding
      summary: Preview a resource dashboard binding change.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardBindingInput'
      responses:
        '201':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /dashboards/{id}/bindings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listDashboardBindings
      summary: List shortcuts visible to the current subject on both sides.
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardBindingView'
        default:
          $ref: '#/components/responses/Error'
  /dashboard-spec/convert-panel:
    post:
      operationId: convertDashboardPanel
      summary: Convert every query in a panel only when the editing sources are losslessly representable.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardConvertPanelInput'
      responses:
        '200':
          description: Atomic conversion result. Unsupported conversion returns the original panel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardConvertedPanel'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/dashboard-queries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startDashboardQueryJob
      summary: startDashboardQueryJob.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardQueryJobInput'
      responses:
        '202':
          description: Persistent query state. Materialized files retain their original attempt and source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardQueryJobView'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/dashboard-queries/{job_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDashboardQueryJob
      summary: getDashboardQueryJob.
      parameters: []
      responses:
        '200':
          description: Persistent query state. Materialized files retain their original attempt and source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardQueryJobView'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/dashboard-queries/{job_id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelDashboardQueryJob
      summary: cancelDashboardQueryJob.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Persistent query state. Materialized files retain their original attempt and source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardQueryJobView'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/dashboard-queries/{job_id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeDashboardQueryJob
      summary: resumeDashboardQueryJob.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardQueryResumeInput'
      responses:
        '202':
          description: Persistent query state. Materialized files retain their original attempt and source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardQueryJobView'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /dashboard-drafts/{id}/drilldown:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: executeDashboardDraftDrilldown
      summary: Preview a registered drilldown from the owned draft and its frozen sample.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardDraftDrilldownInput'
      responses:
        '200':
          description: Draft drilldown execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraftDrilldownExecution'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
    DashboardAnalysisResolveInput:
      type: object
      additionalProperties: false
      required:
        - dashboard_id
        - expected_version
        - changes
        - evidence
      properties:
        dashboard_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 0
        changes:
          $ref: '#/components/schemas/DashboardConditionPatch'
        evidence:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - quote
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 512
                description: JSON pointer for each changed condition; / for reset_all
              quote:
                type: string
                minLength: 1
                maxLength: 2048
                description: Exact excerpt from this Run's user message; a model interpretation with provenance, not proof of semantic correctness
    DashboardAnalysisQueryInput:
      type: object
      additionalProperties: false
      required:
        - dashboard_id
      properties:
        dashboard_id:
          type: string
          format: uuid
        context_ref:
          type: string
          format: uuid
          description: Required for a root query; obtained from context.resolve in the same Run
        panel_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: Optional strategy for this query only; never inherited
        drilldown:
          $ref: '#/components/schemas/DashboardQueryDrilldownInput'
    DashboardAnalysisCandidateInput:
      type: object
      additionalProperties: false
      required:
        - dashboard_id
        - context_ref
        - name
      properties:
        dashboard_id:
          type: string
          format: uuid
        context_ref:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        panel_id:
          type: string
          minLength: 1
          maxLength: 128
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    DashboardItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        folder_id:
          type: string
          format: uuid
        active_revision_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        lifecycle:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - active_revision_id
        - version
        - lifecycle
        - updated_at
    DashboardTimeRange:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - relative
            - absolute
          description: relative requires seconds (1..604800); absolute requires from and to with a positive interval no longer than seven days.
        seconds:
          type: integer
          format: int64
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
        - kind
      example:
        kind: relative
        seconds: 3600
    DashboardSelection:
      type: object
      additionalProperties: false
      properties:
        all:
          type: boolean
        values:
          type: array
          items:
            type: string
      required:
        - all
        - values
    DashboardSourceBinding:
      type: object
      additionalProperties: false
      properties:
        source_type:
          type: string
          description: Use a registered source type from catalog.resources, such as otlp, prometheus, hostmetrics, filelog, skywalking or jaeger; never a resource ID.
          example: otlp
        capability_version:
          type: string
          description: Use the capability version returned by catalog.resources; current supported sources use v1.
          example: v1
      required:
        - source_type
        - capability_version
    DashboardFilter:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        operator:
          type: string
        value:
          type: string
        variable:
          type: string
        local_parameter:
          type: string
        values:
          type: array
          items:
            type: string
            maxLength: 4096
          maxItems: 200
        drilldown_input:
          type: string
      required:
        - field
        - operator
    DashboardParameterBinding:
      type: object
      additionalProperties: false
      properties:
        parameter:
          type: string
        variable:
          type: string
        local_parameter:
          type: string
        identity_mapping:
          type: boolean
        value_map:
          type: object
          additionalProperties:
            type: string
            maxLength: 4096
          maxProperties: 1000
        drilldown_input:
          type: string
      required:
        - parameter
    DashboardCandidateQuery:
      type: object
      additionalProperties: false
      properties:
        signal:
          type: string
          enum:
            - metrics
            - logs
            - traces
        source_binding:
          $ref: '#/components/schemas/DashboardSourceBinding'
        metric:
          type: string
        field:
          type: string
        filters:
          type: array
          items:
