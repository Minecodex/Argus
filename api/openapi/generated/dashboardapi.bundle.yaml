        operation:
          type: string
          enum:
            - value
            - sum
            - avg
            - min
            - max
            - rate
            - topk
            - p95
            - records
            - count
            - count_by
            - count_over_time
            - list
            - detail
            - apm_services
            - apm_instances
            - apm_endpoints
            - apm_red
            - apm_topology
            - trace_graph
            - log_context
            - error_rate
        metric:
          type: string
        metric_type:
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DashboardFilter'
        group_by:
          type: array
          items:
            type: string
        window_seconds:
          type: integer
          format: int64
        bucket_seconds:
          type: integer
          format: int64
        top_n:
          type: integer
          format: int64
        trace_id:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 50000
          description: Optional explicit log, APM or trace-list limit. Log context uses its own before/after bound.
        context_before:
          type: integer
          minimum: 0
          maximum: 200
        context_after:
          type: integer
          minimum: 0
          maximum: 200
        error_filters:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/DashboardFilter'
          description: Fixed error classification for same-counter error_rate. Only literal matchers; shared dynamic scope belongs in filters. Output is a 0..1 ratio; zero traffic produces no data.
      required:
        - operation
        - filters
        - group_by
    DashboardDSL:
      type: object
      additionalProperties: false
      properties:
        expression:
          type: string
        pipeline:
          type: string
        operation:
          type: string
        variables:
          type: object
          additionalProperties: {}
      required:
        - expression
    DashboardDefinition:
      type: object
      additionalProperties: false
      properties:
        builder:
          $ref: '#/components/schemas/DashboardBuilder'
        dsl:
          $ref: '#/components/schemas/DashboardDSL'
      required: []
      description: Exactly one of builder or dsl, matching the containing Panel.authoring_mode.
    DashboardStepPolicy:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - ''
            - fixed
            - auto
          description: Metrics range queries require fixed or auto. fixed requires seconds=1..86400. auto requires target_points=1..10000 AND min_step_seconds>=1. Empty is only for targets that do not use a range step.
        seconds:
          type: integer
          format: int64
          description: 'Required for fixed: interval in seconds, from 1 to 86400.'
          example: 30
        target_points:
          type: integer
          format: int64
          description: 'Required for auto: target data points, from 1 to 10000.'
          example: 120
        min_step_seconds:
          type: integer
          format: int64
          description: 'Required for auto: minimum interval in seconds, at least 1.'
          example: 10
      required:
        - kind
      example:
        kind: auto
        target_points: 120
        min_step_seconds: 10
    DashboardTarget:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        language:
          type: string
          enum:
            - promql
            - kql
            - skywalking_graphql
        signal:
          type: string
          description: 'Omit on display targets: they inherit Panel.signal. Required on a detail target.'
        source_binding:
          $ref: '#/components/schemas/DashboardSourceBinding'
          description: 'Omit on display targets: they inherit Panel.source_binding. Required on a detail target, including cross-signal drilldowns.'
        source_definition:
          $ref: '#/components/schemas/DashboardDefinition'
        query_mode:
          type: string
          enum:
            - ''
            - instant
            - range
          description: PromQL uses instant or range; a metric timeseries uses range. Logs and Trace use an empty string.
        range_step_policy:
          $ref: '#/components/schemas/DashboardStepPolicy'
        parameter_bindings:
          type: array
          items:
            $ref: '#/components/schemas/DashboardParameterBinding'
      required:
        - id
        - language
        - source_definition
        - query_mode
        - range_step_policy
        - parameter_bindings
