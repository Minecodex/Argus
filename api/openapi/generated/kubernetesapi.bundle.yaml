openapi: 3.1.0
info:
  title: Argus Kubernetes API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /enterprise/kubernetes-clusters/{id}/helm/releases:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listKubernetesHelmReleases
      summary: List safe Helm release metadata in an explicitly selected authorized Namespace
      tags:
        - Kubernetes
      parameters:
        - name: namespace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Release metadata without chart, values, manifests or hook output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesHelmReleases'
          headers:
            Cache-Control:
              description: Protected enterprise response is never stored by shared or browser caches
              required: true
              schema:
                type: string
                enum:
                  - no-store
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/helm/releases/{releaseName}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: releaseName
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 53
    get:
      operationId: listKubernetesHelmHistory
      summary: List safe revision metadata for a Helm release
      tags:
        - Kubernetes
      parameters:
        - name: namespace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revision metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesHelmReleases'
          headers:
            Cache-Control:
              description: Protected enterprise response is never stored by shared or browser caches
              required: true
              schema:
                type: string
                enum:
                  - no-store
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/helm/actions/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: previewKubernetesHelm
      summary: Render, authorize and dry-run Helm objects before preparing an immutable approval
      tags:
        - Kubernetes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesHelmPreviewInput'
      responses:
        '201':
          description: Protected Helm PendingAction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
          headers:
            Cache-Control:
              description: Protected enterprise response is never stored by shared or browser caches
              required: true
              schema:
                type: string
                enum:
                  - no-store
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/stream-sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createKubernetesStreamSession
      summary: Create a UID-bound terminal or TCP forwarding session
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Create a UID-bound terminal or TCP forwarding session
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesStreamTicket'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesStreamInput'
  /enterprise/kubernetes-clusters/{id}/stream-sessions/{sessionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKubernetesStreamSession
      summary: Read current Kubernetes session state
      tags:
        - Kubernetes
      responses:
        '200':
          description: Read current Kubernetes session state
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesStreamSession'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/stream-sessions/{sessionId}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: closeKubernetesStreamSession
      summary: Close a Kubernetes terminal or forwarding session
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Close a Kubernetes terminal or forwarding session
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesStreamSession'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/stream-sessions/{sessionId}/ticket:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: issueKubernetesStreamTicket
      summary: Replace the pending one-use Kubernetes stream ticket
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Replace the pending one-use Kubernetes stream ticket
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesStreamTicket'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/log-sessions/{sessionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKubernetesLogSession
      summary: Check the current authorization of the owning Pod log session
      tags:
        - Kubernetes
      responses:
        '200':
          description: Close the owning Pod log session
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesLogSession'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/log-sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createKubernetesLogSession
      summary: Create a UID-bound Pod log session and a one-use attach ticket
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Create a UID-bound Pod log session and a one-use attach ticket
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesLogSessionTicket'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesLogSessionInput'
  /enterprise/kubernetes-clusters/{id}/log-sessions/{sessionId}/attach:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: attachKubernetesLogSession
      summary: Consume the short-lived ticket in the owning HTTP session
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consume the short-lived ticket in the owning HTTP session
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesLogSession'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesLogSessionAttachInput'
  /enterprise/kubernetes-clusters/{id}/log-sessions/{sessionId}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: readKubernetesLogSession
      summary: Read a bounded authorized log increment with a signed continuity cursor
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Read a bounded authorized log increment with a signed continuity cursor
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesLogSessionBatch'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesLogSessionReadInput'
  /enterprise/kubernetes-clusters/{id}/log-sessions/{sessionId}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: closeKubernetesLogSession
      summary: Close the owning Pod log session
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Close the owning Pod log session
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesLogSession'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/operations/{operationId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKubernetesOperation
      summary: Read an authorized operation without its private execution plan
      tags:
        - Kubernetes
      responses:
        '200':
          description: Authorized Kubernetes operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesOperation'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: cancelKubernetesDrain
      summary: Stop further batches of an authorized node drain; in-flight requests may finish and the node stays cordoned
      tags:
        - Kubernetes
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesDrainCancelInput'
      responses:
        '200':
          description: Cancelled node drain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesOperation'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/operations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listKubernetesOperations
      summary: List operations in the current authorized resource scope
      tags:
        - Kubernetes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 32768
      responses:
        '200':
          description: Authorized Kubernetes operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesOperationPage'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/inventory/actions/preview-mutation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: previewKubernetesMutation
      summary: Dry-run an authorized object change and prepare a confirmation
      tags:
        - Kubernetes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesMutationInput'
      responses:
        '201':
          description: Existing PendingAction confirmation workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/inventory/watch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: watchKubernetesInventory
      summary: Watch the current page with frozen UID scope and bounded batches
      tags:
        - Kubernetes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesInventoryWatchInput'
      responses:
        '200':
          description: Bounded events and next authorized resume token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesInventoryWatchResult'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/inventory/types:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listKubernetesInventoryTypes
      summary: List object types available in the current access scope
      tags:
        - Kubernetes
      parameters: []
      responses:
        '200':
          description: Authorized UID-bound Kubernetes observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesInventoryTypes'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/inventory/scope:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKubernetesInventoryScope
      summary: Read current Cluster and Namespace access
      tags:
        - Kubernetes
      parameters: []
      responses:
        '200':
          description: Authorized UID-bound Kubernetes observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesInventoryScope'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/inventory/object:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKubernetesInventoryObject
      summary: Read a projected object with frozen UID
      tags:
        - Kubernetes
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 253
        - name: uid
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: namespace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized UID-bound Kubernetes observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesInventoryObject'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters/{id}/inventory:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listKubernetesInventory
      summary: List authorized Kubernetes objects with server pagination
      tags:
        - Kubernetes
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: namespace_mode
          in: query
          required: false
          schema:
            type: string
            enum:
              - all_authorized
              - explicit
            default: all_authorized
        - name: namespace_ids
          in: query
          required: false
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
              format: uuid
          style: form
          explode: false
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 253
        - name: labels
          in: query
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 1024
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 32768
      responses:
        '200':
          description: Authorized UID-bound Kubernetes observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesInventoryPage'
        default:
          $ref: '#/components/responses/Error'
  /enterprise/kubernetes-clusters:
    get:
      operationId: listKubernetesClusters
      summary: List explicitly authorized Kubernetes clusters.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cluster page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterPage'
        default:
          $ref: '#/components/responses/responses-Error'
  /enterprise/kubernetes-clusters/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getKubernetesCluster
      summary: Get an explicitly authorized Kubernetes cluster.
      responses:
        '200':
          description: Kubernetes cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesCluster'
        default:
          $ref: '#/components/responses/responses-Error'
  /enterprise/kubernetes-clusters/actions/preview-create:
    post:
      operationId: previewCreateKubernetesCluster
      summary: Freeze a Kubernetes cluster creation plan.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/parameters-CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesPreviewCreate'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/responses-Error'
  /enterprise/kubernetes-clusters/{id}/actions/preview-update:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewUpdateKubernetesCluster
      summary: Freeze a Kubernetes cluster update.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/parameters-CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesPreviewUpdate'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/responses-Error'
  /enterprise/kubernetes-clusters/{id}/actions/preview-delete:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: previewDeleteKubernetesCluster
      summary: Freeze a Kubernetes cluster logical deletion.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/parameters-CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePreviewDelete'
      responses:
        '201':
          description: Pending Action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/responses-Error'
  /enterprise/kubernetes-clusters/connection-tests:
    post:
      operationId: createKubernetesConnectionTest
      summary: Start a bounded Kubernetes connection test.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/parameters-CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesConnectionTestCreate'
      responses:
        '202':
          description: Connection Test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTest'
        default:
          $ref: '#/components/responses/responses-Error'
  /enterprise/kubernetes-clusters/{id}/resources:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: listKubernetesResources
      summary: List bounded Kubernetes resources after Kubernetes cluster authorization checks.
      parameters:
        - name: resource_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - namespace
              - node
              - pod
              - deployment
              - statefulset
              - daemonset
              - service
        - name: namespace
          in: query
          required: false
          schema:
            type: string
            maxLength: 253
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Kubernetes resource page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesResourcePage'
        default:
          $ref: '#/components/responses/responses-Error'
  /enterprise/kubernetes-clusters/{id}/pod-logs:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getKubernetesPodLogs
      summary: Read at most one MiB of Pod logs.
      parameters:
        - name: namespace
          in: query
          required: true
          schema:
            type: string
            maxLength: 253
        - name: pod
          in: query
          required: true
          schema:
            type: string
            maxLength: 253
        - name: container
          in: query
          required: false
          schema:
            type: string
            maxLength: 253
        - name: tail_lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
      responses:
        '200':
          description: Bounded Pod logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodLogs'
        default:
          $ref: '#/components/responses/responses-Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
