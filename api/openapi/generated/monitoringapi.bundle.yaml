openapi: 3.1.0
info:
  title: Argus monitoringapi
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /applications:
    get:
      operationId: listMonitoringApplications
      summary: Search authorized single-environment applications
      tags:
        - Monitoring
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 200
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - archived
            default: active
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringApplicationPage'
        default:
          $ref: '#/components/responses/Error'
  /applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMonitoringApplication
      summary: Read an authorized application
      tags:
        - Monitoring
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringApplication'
        default:
          $ref: '#/components/responses/Error'
  /applications/services:
    get:
      operationId: listMonitoringServices
      summary: Search services within authorized applications
      tags:
        - Monitoring
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 200
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: application_ids
          in: query
          style: form
          explode: false
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
              format: uuid
        - name: application_mode
          in: query
          description: explicit preserves an empty application_ids set; all_authorized enumerates current grants
          schema:
            type: string
            enum:
              - all_authorized
              - explicit
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringServicePage'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/commands/preview:
    post:
      operationId: previewMonitoringCommand
      summary: Preview an immutable monitoring workspace change
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringMutation'
      responses:
        '201':
          description: Existing PendingAction confirmation workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/collections:
    get:
      operationId: listMonitoringCollections
      summary: Search and filter authorized collections before pagination
      tags:
        - Monitoring
      parameters:
        - name: desired_enabled
          in: query
          description: Omit for both states; false explicitly selects disabled collections.
          schema:
            type: boolean
        - name: apply_status
          in: query
          schema:
            type: string
            enum:
              - pending
              - applying
              - effective
              - failed
              - unknown
        - name: health
          in: query
          schema:
            type: string
            enum:
              - unknown
              - healthy
              - degraded
              - failed
              - stopped
        - name: freshness
          in: query
          description: Uses the same three-interval / two-minute sample freshness threshold as collection rows.
          schema:
            type: string
            enum:
              - no_data
              - fresh
              - stale
        - name: search
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 200
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: integration
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 64
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringCollectionPage'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMonitoringCollection
      summary: Read a collection and its observed state
      tags:
        - Monitoring
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringCollection'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/targets:
    get:
      operationId: listMonitoringTargets
      summary: Search authorized targets
      tags:
        - Monitoring
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 200
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: integration
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 64
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringTargetPage'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/integrations:
    get:
      operationId: listMonitoringIntegrations
      summary: List integration eligibility and validation status
      tags:
        - Monitoring
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitoringIntegration'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/collectors:
    get:
      operationId: listMonitoringCollectorChoices
      summary: Search authorized executing Collectors
      tags:
        - Monitoring
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 0
            maxLength: 200
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Authorized monitoring workspace result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringCollectorChoicePage'
        default:
          $ref: '#/components/responses/Error'
  /applications/{id}/ingest-endpoints:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listApplicationIngestEndpoints
      summary: List authorized application ingestion endpoints
      tags:
        - Monitoring
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Authorized application ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringIngestEndpointPage'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/ingest-endpoints/{id}/keys:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listApplicationIngestKeys
      summary: List ingestion Key metadata without credentials
      tags:
        - Monitoring
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Authorized application ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringIngestKeyPage'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/ingest-keys/{id}/reveal:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revealApplicationIngestKey
      summary: Reveal a newly issued Key once to its interactive creator
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Authorized application ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringIngestKeyReveal'
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
        default:
          $ref: '#/components/responses/Error'
  /monitoring/builtins:
    get:
      operationId: listMonitoringBuiltins
      summary: List fixed resource-owned collection instances and actual state
      tags:
        - Monitoring
      parameters:
        - name: target_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - host
              - kubernetes_cluster
        - name: target_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fixed collection definitions and observed state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitoringBuiltin'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/builtins/preview:
    post:
      operationId: previewMonitoringBuiltin
      summary: Preview an own-resource fixed collection change
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringBuiltinInput'
      responses:
        '201':
          description: Existing PendingAction confirmation workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pending-action-public.schema'
        default:
          $ref: '#/components/responses/Error'
  /monitoring/ingest-endpoints/{id}/connection:
    parameters:
      - schema:
          type: string
          format: uuid
        in: path
        required: true
        name: id
    get:
      operationId: getMonitoringIngestConnection
      summary: Read authorized SDK endpoint configuration and public TLS trust without a Key
      tags:
        - Monitoring
      responses:
        '200':
          description: Application-scoped SDK connection metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringIngestConnection'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argus_session
  schemas:
    RequestId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._-]+$
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
        - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message_key:
          type: string
          pattern: ^errors\.[a-z0-9_.]+$
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        trace_id:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
    MonitoringApplication:
      additionalProperties: false
      properties:
        application_key:
          maxLength: 100
          minLength: 1
          type: string
        created_at:
          format: date-time
          type: string
        description:
          maxLength: 4096
          minLength: 0
          type: string
        environment:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          type: string
        id:
          format: uuid
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        owner_name:
          maxLength: 200
          minLength: 0
          type: string
        status:
          enum:
            - active
            - archived
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          minimum: 1
          type: integer
      required:
        - id
        - application_key
        - name
        - environment
        - description
        - owner_name
        - status
        - version
        - created_at
        - updated_at
      type: object
    MonitoringApplicationPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/MonitoringApplication'
          type: array
        next_cursor:
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - items
      type: object
    MonitoringApplicationService:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          type: string
        first_seen_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        last_seen_at:
          format: date-time
          type: string
        runtime:
          maxLength: 200
          minLength: 0
          type: string
        service_name:
          maxLength: 200
          minLength: 1
          type: string
        service_namespace:
          maxLength: 200
          minLength: 0
          type: string
        status:
          enum:
            - active
            - archived
          type: string
        version:
          format: int64
          minimum: 1
          type: integer
      required:
        - id
        - application_id
        - service_namespace
        - service_name
        - runtime
        - status
        - version
      type: object
    MonitoringServicePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/MonitoringApplicationService'
          type: array
        next_cursor:
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - items
      type: object
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
    MonitoringApplicationInput:
      additionalProperties: false
      properties:
        application_key:
          maxLength: 100
          minLength: 1
          type: string
        description:
          maxLength: 4096
          minLength: 0
          type: string
        environment:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        owner_name:
          maxLength: 200
          minLength: 0
          type: string
      required:
        - name
      type: object
    MonitoringResourceRef:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        kind:
          enum:
            - host
            - kubernetes_cluster
            - monitoring_target
          type: string
      required:
        - kind
        - id
      type: object
    MonitoringBindingInput:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          type: string
        service_id:
          format: uuid
          type: string
        target:
          $ref: '#/components/schemas/MonitoringResourceRef'
      required:
        - application_id
        - target
      type: object
    MonitoringCollectionBindingInput:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          type: string
        service_id:
          format: uuid
          type: string
      required:
        - application_id
      type: object
    MonitoringComponentTLS:
      additionalProperties: false
      properties:
        ca_pem:
          description: Public certificate PEM only; private keys and authentication material are rejected.
          maxLength: 262144
          type: string
        server_name:
          maxLength: 253
          type: string
      type: object
    MonitoringLogWorkloadInput:
      additionalProperties: false
      description: Client-selected workload identity. Namespace identity and owner ancestry are resolved by the server and are never writable input.
      properties:
        containers:
          items:
            maxLength: 63
            minLength: 1
            type: string
          maxItems: 32
          minItems: 1
          type: array
          uniqueItems: true
        name:
          maxLength: 253
          minLength: 1
          type: string
        namespace_id:
          format: uuid
          type: string
        type:
          enum:
            - pod
            - deployment
            - replicaset
            - daemonset
            - statefulset
            - job
            - cronjob
          type: string
        uid:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - namespace_id
        - type
        - name
        - uid
        - containers
      type: object
    MonitoringCollectionConfigInput:
      additionalProperties: false
      properties:
        allow_native_passwords:
          type: boolean
        auth_source:
          maxLength: 253
          minLength: 0
          type: string
        channel:
          maxLength: 200
          minLength: 1
          type: string
        component_tls:
          $ref: '#/components/schemas/MonitoringComponentTLS'
        direct_connection:
          type: boolean
        dns_network:
          enum:
            - udp
            - tcp
            - tcp-tls
          type: string
        encoding:
          enum:
            - utf-8
            - utf-16le
            - utf-16be
            - ascii
          type: string
        exclude:
          items:
            maxLength: 1024
            minLength: 1
            type: string
          maxItems: 16
          type: array
        format:
          enum:
            - text
            - json
          type: string
        group_match:
          maxLength: 256
          minLength: 0
          type: string
        include:
          items:
            maxLength: 1024
            minLength: 1
            type: string
          maxItems: 16
          type: array
        indices:
          items:
            maxLength: 256
            minLength: 1
            type: string
          maxItems: 100
          type: array
        interval:
          maxLength: 20
          minLength: 1
          type: string
        max_log_bytes:
          maximum: 1048576
          minimum: 1024
          type: integer
        method:
          enum:
            - GET
            - HEAD
            - OPTIONS
          type: string
        multiline_start:
          maxLength: 1024
          type: string
        nodes:
          items:
            maxLength: 256
            minLength: 1
            type: string
          maxItems: 100
          type: array
        ping_count:
          maximum: 10
          minimum: 1
          type: integer
        record_type:
          enum:
            - A
            - AAAA
            - CNAME
            - MX
            - TXT
            - NS
            - SOA
            - SRV
          type: string
        replica_set:
          maxLength: 253
          minLength: 0
          type: string
        sasl_mechanism:
          enum:
            - PLAIN
            - SCRAM-SHA-256
            - SCRAM-SHA-512
          type: string
        scope:
          enum:
            - business
            - system
            - component
            - resource
          type: string
        start_at:
          enum:
            - beginning
            - end
          type: string
        timeout:
          maxLength: 20
          minLength: 1
          type: string
        tls:
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            server_name:
              maxLength: 253
              minLength: 0
              type: string
          required:
            - enabled
          type: object
        topic_match:
          maxLength: 256
          minLength: 0
          type: string
        units:
          items:
            maxLength: 200
            minLength: 1
            type: string
          maxItems: 64
          type: array
        workload:
          $ref: '#/components/schemas/MonitoringLogWorkloadInput'
      required: []
      type: object
    MonitoringCollectionResourceRef:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        kind:
          enum:
            - host
            - kubernetes_cluster
            - monitoring_target
            - application
          type: string
      required:
        - kind
        - id
      type: object
    MonitoringTargetIdentity:
      additionalProperties: false
      properties:
        database:
          maxLength: 128
          minLength: 0
          type: string
        endpoint:
          maxLength: 2048
          minLength: 1
          type: string
        hostnames:
          items:
            maxLength: 253
            minLength: 1
            type: string
          maxItems: 32
          type: array
        members:
          items:
            maxLength: 2048
            minLength: 1
            type: string
          maxItems: 16
          type: array
      required:
        - endpoint
      type: object
    MonitoringCollectionInput:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          type: string
        bindings:
          items:
            $ref: '#/components/schemas/MonitoringCollectionBindingInput'
          maxItems: 100
          type: array
        collector_id:
          format: uuid
          type: string
        config:
          $ref: '#/components/schemas/MonitoringCollectionConfigInput'
        credential_update:
          enum:
            - keep
            - replace
            - remove
          type: string
        enabled:
          type: boolean
        integration:
          maxLength: 64
          minLength: 1
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        service_id:
          format: uuid
          type: string
        target:
          $ref: '#/components/schemas/MonitoringCollectionResourceRef'
        target_identity:
          $ref: '#/components/schemas/MonitoringTargetIdentity'
        target_name:
          maxLength: 200
          minLength: 1
          type: string
      required: []
      type: object
    MonitoringCredentialInput:
      additionalProperties: false
      properties:
        password:
          maxLength: 65536
          minLength: 0
          type: string
          writeOnly: true
        username:
          maxLength: 256
          minLength: 0
          type: string
          writeOnly: true
      required: []
      type: object
      writeOnly: true
    MonitoringIngestEndpointInput:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          type: string
        collector_id:
          format: uuid
          type: string
        enabled:
          type: boolean
        name:
          maxLength: 200
          minLength: 1
          type: string
        protocol:
          enum:
            - otlp
            - jaeger
            - skywalking
          type: string
        service_allowlist:
          items:
            format: uuid
            type: string
          maxItems: 100
          type: array
        signals:
          items:
            enum:
              - metrics
              - logs
              - traces
            type: string
          maxItems: 3
          minItems: 1
          type: array
          uniqueItems: true
      required: []
      type: object
    MonitoringIngestKeyInput:
      additionalProperties: false
      properties:
        endpoint_id:
          format: uuid
          type: string
        expires_at:
          format: date-time
          type: string
      required: []
      type: object
    MonitoringApplicationServiceInput:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          type: string
        service_name:
          maxLength: 200
          minLength: 1
          type: string
        service_namespace:
          maxLength: 200
          type: string
      required:
        - application_id
        - service_name
      type: object
    MonitoringMutation:
      additionalProperties: false
      properties:
        application:
          $ref: '#/components/schemas/MonitoringApplicationInput'
        binding:
          $ref: '#/components/schemas/MonitoringBindingInput'
        collection:
          $ref: '#/components/schemas/MonitoringCollectionInput'
        credentials:
          $ref: '#/components/schemas/MonitoringCredentialInput'
        endpoint:
          $ref: '#/components/schemas/MonitoringIngestEndpointInput'
        expected_version:
          format: int64
          minimum: 1
          type: integer
        id:
          format: uuid
          type: string
