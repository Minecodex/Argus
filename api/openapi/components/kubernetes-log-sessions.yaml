        "type": "object",
        "additionalProperties": false,
        "properties": {
          "content": {
            "type": "string",
            "minLength": 0,
            "maxLength": 524288
          },
          "next_cursor": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "truncated": {
            "type": "boolean"
          },
          "pending_line": {
            "type": "boolean"
