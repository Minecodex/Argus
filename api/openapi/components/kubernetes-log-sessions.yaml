          "redacted": {
            "type": "boolean"
          },
          "complete": {
            "type": "boolean"
          }
        },
        "required": [
          "content",
          "next_cursor",
          "observed_at",
          "truncated",
          "pending_line",
          "redacted",
          "complete"
        ]
      }
