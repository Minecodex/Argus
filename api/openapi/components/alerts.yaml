{
  "components": {
    "schemas": {
      "AlertKind": {
        "type": "string",
        "enum": [
          "policy",
          "silence",
          "inhibition",
          "channel",
          "route",
          "settings",
          "template",
          "grouping"
        ]
      },
      "AlertMatcher": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "operator": {
            "type": "string",
            "enum": [
              "=",
              "!=",
              "=~",
              "!~"
            ]
          },
          "value": {
            "type": "string",
            "maxLength": 512
          }
        },
        "required": [
          "key",
          "operator",
          "value"
        ]
      },
      "AlertResourceSelector": {
        "type": "object",
        "description": "Resolve hosts, clusters, applications or monitoring targets with the resource tools before selecting their explicit UUIDs. Dynamic selection evaluates resource LABELS inside the evaluator's existing grants; the resource name field is not a label. 指定主机、集群、应用或监控目标时先查询实际 UUID 并使用 explicit + ids；dynamic 的 matchers 只匹配资源 labels，不匹配资源名称字段。",
        "additionalProperties": false,
        "properties": {
          "mode": {
            "type": "string",
            "description": "Use explicit for concrete requested resources; dynamic is for intentionally changing label-selected authorized sets.",
            "enum": [
              "dynamic",
              "explicit"
            ]
          },
          "types": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "host",
                "kubernetes_cluster",
                "application",
                "monitoring_target"
              ]
            },
            "uniqueItems": true
          },
          "ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          },
          "matchers": {
            "type": "array",
            "description": "Resource labels only. Do not use name as a matcher to select a named resource unless that exact label was read from the resource.",
            "items": {
              "$ref": "#/components/schemas/AlertMatcher"
            },
            "maxItems": 32
          },
          "source_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          }
        },
        "required": [
          "mode",
          "types"
        ]
      },
      "AlertRule": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "expression": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192
          },
          "query_mode": {
            "type": "string",
            "enum": [
              "numeric",
              "predicate"
            ]
          },
          "presence_expression": {
            "type": "string",
            "maxLength": 8192
          },
          "operator": {
            "type": "string",
            "enum": [
              ">",
              ">=",
              "<",
              "<=",
              "==",
              "!="
            ]
          },
          "threshold": {
            "type": "number",
            "format": "double"
          },
          "recovery_threshold": {
            "type": "number",
            "format": "double"
          },
          "severity": {
            "type": "string",
            "enum": [
              "critical",
              "warning",
              "info"
            ]
          },
          "unit": {
            "type": "string",
            "maxLength": 32
          }
        },
        "required": [
          "name",
          "expression",
          "query_mode",
          "operator",
          "threshold",
          "recovery_threshold",
          "severity"
        ]
      },
      "AlertPolicySpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "description": {
            "type": "string",
            "maxLength": 4096
          },
          "enabled": {
            "type": "boolean"
          },
          "resources": {
            "$ref": "#/components/schemas/AlertResourceSelector"
          },
          "rules": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AlertRule"
            },
            "minItems": 1,
            "maxItems": 32
          },
          "mode": {
            "type": "string",
            "enum": [
              "independent",
              "every",
              "any"
            ]
          },
          "match_by": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 12
          },
          "interval_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 10,
            "maximum": 3600
          },
          "for_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 86400
          },
          "recovery_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 86400
          },
          "no_data_behavior": {
            "type": "string",
            "enum": [
              "report",
              "keep"
            ]
          },
          "error_behavior": {
            "type": "string",
            "enum": [
              "report",
              "keep"
            ]
          },
          "channel_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          },
          "route_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          },
          "labels": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "maxLength": 512
            }
          }
        },
        "required": [
          "enabled",
          "resources",
          "rules",
          "mode",
          "interval_seconds",
          "for_seconds",
          "recovery_seconds",
          "no_data_behavior",
          "error_behavior"
        ]
      },
      "AlertSilenceSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "resource_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000,
            "description": "Explicit resource identity selection. For a named host/cluster resolve its actual UUID and include it here; label matchers do not match resource names. An explicit empty array selects all evaluator-authorized resources only when that full scope is requested. Omitted or null selection is invalid. 指定资源使用真实 UUID；明确选择全部授权范围时才传空数组。"
          },
          "policy_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          },
          "metric": {
            "type": "string",
            "maxLength": 8192
          },
          "matchers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AlertMatcher"
            },
            "maxItems": 32,
            "description": "Filters actual observed metric labels within resource_ids; never substitute a named host or cluster for its UUID using a guessed cluster/name label."
          },
          "starts_at": {
            "type": "string",
            "format": "date-time"
          },
          "ends_at": {
            "type": "string",
            "format": "date-time"
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        },
        "required": [
          "enabled",
          "starts_at",
          "ends_at",
          "reason",
          "resource_ids"
        ]
      },
      "AlertInhibitionSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "resource_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000,
            "description": "Explicit resource identity selection. For a named host/cluster resolve its actual UUID and include it here; label matchers do not match resource names. An explicit empty array selects all evaluator-authorized resources only when that full scope is requested. Omitted or null selection is invalid. 指定资源使用真实 UUID；明确选择全部授权范围时才传空数组。"
          },
          "source": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AlertMatcher"
            },
            "maxItems": 32
          },
          "target": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AlertMatcher"
            },
            "maxItems": 32
          },
          "equal": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "minItems": 1,
            "maxItems": 12
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        },
        "required": [
          "enabled",
          "source",
          "target",
          "equal",
          "reason",
          "resource_ids"
        ]
      },
      "AlertChannelSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "provider": {
            "type": "string",
            "enum": [
              "dingtalk",
              "wecom",
              "feishu",
              "smtp"
            ]
          },
          "credential_id": {
            "type": "string",
            "format": "uuid"
          },
          "display_address": {
            "type": "string",
            "maxLength": 200
          },
          "mention_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 256
            },
            "maxItems": 100
          },
          "mention_all": {
            "type": "boolean"
          },
          "template": {
            "type": "string",
            "maxLength": 16384
          },
          "default_for_new_policies": {
            "type": "boolean",
            "description": "Preselect this enabled channel in new portal policy drafts. Existing policies and explicit API/tool targets remain unchanged."
          }
        },
        "required": [
          "enabled",
          "provider",
          "credential_id"
        ]
      },
      "AlertRouteSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "matchers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AlertMatcher"
            },
            "maxItems": 32
          },
          "channel_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          },
          "continue": {
            "type": "boolean"
          },
          "priority": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 10000
          }
        },
        "required": [
          "enabled",
          "matchers",
          "channel_ids",
          "continue",
          "priority"
        ]
      },
      "AlertSettingsSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "evaluator_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "evaluator_id"
        ]
      },
      "AlertGroupingSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "group_by": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 12
          },
          "wait_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 3600
          },
          "interval_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 86400
          },
          "repeat_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 604800
          },
          "timing": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "first",
                "repeat",
                "recovery",
                "severity"
              ]
            },
            "uniqueItems": true
          }
        },
        "required": [
          "group_by",
          "wait_seconds",
          "interval_seconds",
          "repeat_seconds",
          "timing"
        ]
      },
      "AlertTemplateSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "content": {
            "type": "string",
            "minLength": 1,
            "maxLength": 16384
          }
        },
        "required": [
          "content"
        ]
      },
      "AlertSpec": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/AlertPolicySpec"
          },
          {
            "$ref": "#/components/schemas/AlertSilenceSpec"
          },
          {
            "$ref": "#/components/schemas/AlertInhibitionSpec"
          },
          {
            "$ref": "#/components/schemas/AlertChannelSpec"
          },
          {
            "$ref": "#/components/schemas/AlertRouteSpec"
          },
          {
            "$ref": "#/components/schemas/AlertSettingsSpec"
          },
          {
            "$ref": "#/components/schemas/AlertGroupingSpec"
          },
          {
            "$ref": "#/components/schemas/AlertTemplateSpec"
          }
        ]
      },
      "AlertConfiguration": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "$ref": "#/components/schemas/AlertKind"
          },
          "name": {
            "type": "string"
          },
          "spec": {
            "$ref": "#/components/schemas/AlertSpec"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "generation": {
            "type": "integer",
            "format": "int64"
          },
          "health": {
            "type": "string"
          },
          "error_code": {
            "type": "string"
          },
          "last_evaluated_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_successful_at": {
            "type": "string",
            "format": "date-time"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "matched_instances": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "managed_by": {
            "type": "string",
            "enum": [
              "collector_delivery"
            ]
          }
        },
        "required": [
          "id",
          "kind",
          "name",
          "spec",
          "version",
          "generation",
          "health",
          "created_at",
          "updated_at"
        ]
      },
      "AlertMutation": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kind": {
            "$ref": "#/components/schemas/AlertKind"
          },
          "operation": {
            "type": "string",
            "enum": [
              "create",
              "update",
              "delete",
              "enable",
              "disable"
            ]
          },
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "spec": {
            "$ref": "#/components/schemas/AlertSpec"
          },
          "expected_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        },
        "required": [
          "kind",
          "operation"
        ]
      },
      "AlertInstanceState": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string"
          },
          "policy_name": {
            "type": "string"
          },
          "rule_id": {
            "type": "string",
            "format": "uuid"
          },
          "metric": {
            "type": "string"
          },
          "labels": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "maxLength": 512
            }
          },
          "value": {
            "type": "number",
            "format": "double"
          },
          "threshold": {
            "type": "number",
            "format": "double"
          },
          "recovery_threshold": {
            "type": "number",
            "format": "double"
          },
          "unit": {
            "type": "string"
          },
          "pending_since": {
            "type": "string",
            "format": "date-time"
          },
          "recovering_since": {
            "type": "string",
            "format": "date-time"
          },
          "last_slot": {
            "type": "string",
            "format": "date-time"
          },
          "policy_snapshot": {
            "$ref": "#/components/schemas/AlertPolicySpec"
          },
          "notification_state": {
            "type": "string"
          },
          "noise_reasons": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "last_notification_at": {
            "type": "string",
            "format": "date-time"
          },
          "closure_reason": {
            "type": "string"
          },
          "kind": {
            "type": "string"
          },
          "members": {
            "type": "array",
            "maxItems": 32,
            "items": {
              "$ref": "#/components/schemas/AlertMemberValue"
            }
          },
          "evaluator_id": {
            "type": "string",
            "format": "uuid"
          },
          "authorization_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "source_snapshot": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "latest_source_snapshot": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "last_successful_at": {
            "type": "string",
            "format": "date-time",
            "description": "Time of the last successful evaluation that produced the retained value and members. Unchanged on failed evaluations; absent when unknown. This is not the telemetry sample timestamp."
          },
          "delivery_gap": {
            "$ref": "#/components/schemas/CollectorDeliveryReport"
          }
        },
        "required": [
          "name",
          "policy_name",
          "rule_id",
          "metric",
          "labels",
          "threshold",
          "recovery_threshold",
          "unit",
          "last_slot",
          "policy_snapshot",
          "notification_state",
          "noise_reasons",
          "kind"
        ]
      },
      "AlertInstance": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "policy_id": {
            "type": "string",
            "format": "uuid"
          },
          "policy_version": {
            "type": "integer",
            "format": "int64"
          },
          "resource_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          },
          "source_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "uniqueItems": true,
            "maxItems": 1000
          },
          "state": {
            "$ref": "#/components/schemas/AlertInstanceState"
          },
          "lifecycle": {
            "type": "string",
            "enum": [
              "normal",
              "pending",
              "firing",
              "recovering",
              "resolved",
              "closed"
            ]
          },
          "health": {
            "type": "string"
          },
          "severity": {
            "type": "string",
            "enum": [
              "critical",
              "warning",
              "info"
            ]
          },
          "acknowledged": {
            "type": "boolean"
          },
          "owner_id": {
            "type": "string",
            "format": "uuid"
          },
          "started_at": {
            "type": "string",
            "format": "date-time"
          },
          "resolved_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_evaluated_at": {
            "type": "string",
            "format": "date-time"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "handling_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "policy_id",
          "policy_version",
          "resource_ids",
          "source_ids",
          "state",
          "lifecycle",
          "health",
          "severity",
          "acknowledged",
          "last_evaluated_at",
          "version",
          "handling_version"
        ]
      },
      "AlertEvent": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "instance_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_type": {
            "type": "string"
          },
          "payload": {
            "type": "object",
            "additionalProperties": true
          },
          "actor_id": {
            "type": "string",
            "format": "uuid"
          },
          "origin": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "instance_id",
          "event_type",
          "payload",
          "origin",
          "created_at"
        ]
      },
      "AlertHandleInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "operation": {
            "type": "string",
            "enum": [
              "acknowledge",
              "assign",
              "comment"
            ]
          },
          "owner_id": {
            "type": "string",
            "format": "uuid"
          },
          "comment": {
            "type": "string",
            "maxLength": 4000
          },
          "expected_handling_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        },
        "required": [
          "operation",
          "expected_handling_version"
        ]
      },
      "AlertCommand": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "operation": {
            "type": "string",
            "enum": [
              "notification.test",
              "notification.resend",
              "event.acknowledge",
              "event.assign",
              "event.comment"
            ]
          },
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "expected_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "handling": {
            "$ref": "#/components/schemas/AlertHandleInput"
          },
          "expected_handling_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        },
        "required": [
          "operation",
          "id"
        ]
      },
      "AlertMessage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "subject": {
            "type": "string"
          },
          "text": {
            "type": "string"
          },
          "event_type": {
