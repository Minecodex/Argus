{
  "components": {
    "schemas": {
      "KubernetesMetricSelection": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "explicit",
              "all_authorized"
            ]
          },
          "ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "maxItems": 1000
          }
        },
        "required": [
          "mode"
        ]
      },
      "KubernetesMetricList": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "type": {
            "type": "string",
            "maxLength": 128
          },
          "namespaces": {
            "$ref": "#/components/schemas/KubernetesMetricSelection"
          },
          "state": {
            "type": "string",
            "maxLength": 32
          },
          "name": {
            "type": "string",
            "maxLength": 253
          },
          "labels": {
            "type": "string",
            "maxLength": 1024
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 50
          },
          "cursor": {
            "type": "string",
            "maxLength": 32768
          }
        },
        "required": [
          "type",
          "namespaces"
        ]
      },
      "KubernetesMetricPrepareInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "list": {
            "$ref": "#/components/schemas/KubernetesMetricList"
          },
          "uids": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            "maxItems": 50,
            "minItems": 1
          }
        },
        "required": [
          "list",
          "uids"
        ]
      },
      "KubernetesMetricContext": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "token": {
            "type": "string",
            "maxLength": 393216
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "complete": {
            "type": "boolean"
          }
        },
        "required": [
          "token",
          "observed_at",
          "expires_at",
          "complete"
        ]
      },
      "KubernetesMetricReadInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "token": {
            "type": "string",
            "minLength": 1,
            "maxLength": 393216
          },
          "metric": {
            "type": "string",
            "enum": [
              "cpu",
              "memory",
              "storage"
            ]
          }
        },
        "required": [
          "token",
          "metric"
        ]
      },
      "KubernetesMetricPoint": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "time": {
            "type": "string",
            "format": "date-time"
          },
          "value": {
            "type": [
              "number",
              "null"
            ]
          },
          "request": {
            "type": [
              "number",
              "null"
            ]
          },
          "limit": {
            "type": [
              "number",
              "null"
            ]
          },
          "capacity": {
            "type": [
              "number",
              "null"
            ]
          }
        },
        "required": [
          "time",
          "value"
        ]
      },
      "KubernetesMetricTrend": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "cpu",
              "memory",
              "ephemeral",
              "local_filesystem",
              "volume"
            ]
          },
          "unit": {
            "type": "string",
            "enum": [
              "cores",
              "bytes"
            ]
          },
          "state": {
            "type": "string",
            "enum": [
              "ready",
              "no_data",
              "stale",
              "partial",
              "not_configured",
              "forbidden",
              "query_failed",
              "identity_changed",
              "unsupported"
            ]
          },
          "reason": {
            "type": "string",
            "maxLength": 128
          },
          "basis": {
            "type": "string",
            "enum": [
              "usage",
              "request",
              "limit",
              "capacity"
            ]
          },
          "points": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/KubernetesMetricPoint"
            },
            "maxItems": 61
          },
          "current_request": {
            "type": [
              "number",
              "null"
            ]
          },
          "current_limit": {
            "type": [
              "number",
              "null"
            ]
          },
          "current_capacity": {
            "type": [
              "number",
              "null"
            ]
          },
          "allocatable": {
            "type": [
              "number",
              "null"
            ]
          },
          "partial_configuration": {
            "type": "boolean"
          }
        },
        "required": [
          "kind",
          "unit",
          "state",
          "basis",
          "points",
          "partial_configuration"
        ]
      },
      "KubernetesMetricEntry": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "uid": {
            "type": "string",
            "maxLength": 128
          },
          "trends": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/KubernetesMetricTrend"
            },
            "maxItems": 2
          }
        },
        "required": [
          "uid",
          "trends"
        ]
      },
      "KubernetesMetricResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/KubernetesMetricEntry"
            },
            "maxItems": 50
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "from": {
            "type": "string",
            "format": "date-time"
          },
          "to": {
            "type": "string",
            "format": "date-time"
          },
          "complete": {
            "type": "boolean"
          }
        },
        "required": [
          "items",
          "observed_at",
          "from",
          "to",
          "complete"
        ]
      }
    }
  }
}
