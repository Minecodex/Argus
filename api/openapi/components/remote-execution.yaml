components:
  schemas:
    RemoteExecution:
      type: object
      additionalProperties: false
      required: [id, action_ref, content_hash, status, stop_requested, revision, spec, results, updated_at]
      properties:
        id: {type: string, format: uuid}
        action_ref: {type: string}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {type: string, enum: [awaiting_confirmation, ready, running, succeeded, failed, partial_failed, result_unknown, paused_for_recovery, stopping, cancelled, superseded, expired]}
        stop_requested: {type: boolean}
        confirmation_required: {type: boolean}
        stop_status: {type: string, enum: ['', requested, confirmed, unknown]}
        revision: {type: integer, minimum: 1}
        spec: {$ref: '#/components/schemas/RemotePlan'}
        results: {type: array, items: {$ref: '#/components/schemas/RemoteStepResult'}}
        error_code: {type: string}
        updated_at: {type: string, format: date-time}
    RemotePlan:
      type: object
      additionalProperties: false
      required: [schema_version, id, kind, title, description, steps, inputs]
      properties:
        conversation_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        schema_version: {type: string, const: argus.remote_execution/v1}
        id: {type: string, format: uuid}
        kind: {type: string, enum: [connect, plan]}
        title: {type: string}
        description: {type: string}
        steps: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/RemoteStep'}}
        inputs: {type: array, items: {$ref: '#/components/schemas/RemoteFile'}}
        supersedes_id: {type: string, format: uuid}
        recovery_of_id: {type: string, format: uuid}
    RemoteTarget:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id]
      properties:
        name: {type: string}
        resource_version: {type: integer, format: int64}
        resource_type: {type: string, enum: [host, kubernetes_cluster]}
        resource_id: {type: string, format: uuid}
        namespace: {type: string}
        pod: {type: string}
        pod_uid: {type: string}
        container: {type: string}
    RemoteIdentity:
      type: object
      additionalProperties: false
      required: [id, username, version, platform]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        sid: {type: string}
        version: {type: integer, format: int64}
        platform: {type: string, enum: [linux, windows, kubernetes]}
    RemoteStep:
      type: object
      additionalProperties: false
      required: [id, description, target, interpreter, script, timeout_seconds, session_id, session_generation, context_revision, identity]
      properties:
        id: {type: string, format: uuid}
        description: {type: string}
        target: {$ref: '#/components/schemas/RemoteTarget'}
        interpreter: {type: string, enum: [bash, powershell, kubectl, pod_bash]}
        script: {type: string}
        timeout_seconds: {type: integer, minimum: 1, maximum: 1800}
        session_id: {type: string, format: uuid}
        session_generation: {type: string, format: uuid}
        context_revision: {type: integer, format: int64}
        known_directory: {type: string, description: Last observed location at plan preparation; earlier steps in this plan may change it.}
        interpreter_version: {type: string, description: Last observed interpreter version; absent before approved initialization.}
        previous_request_id: {type: string, format: uuid}
        previous_sequence: {type: integer, minimum: 1}
        identity: {$ref: '#/components/schemas/RemoteIdentity'}
    RemoteFile:
      type: object
      additionalProperties: false
      required: [path, byte_size, content_hash]
      properties:
        id: {type: string, format: uuid}
        content_preview: {type: string}
        workspace_id: {type: string, format: uuid}
        path: {type: string}
        byte_size: {type: integer, format: int64, minimum: 0}
        content_hash: {type: string}
        source_ref: {type: string}
    RemoteStepResult:
      type: object
      additionalProperties: false
      required: [sequence, status, exit_code, stdout, stderr, truncated, directory, session_lost, output_files, observed_at]
      properties:
        sequence: {type: integer}
        status: {type: string}
        exit_code: {type: integer}
        stdout: {type: string}
        stderr: {type: string}
        truncated: {type: boolean}
        directory: {type: string}
        session_lost: {type: boolean}
        error_code: {type: string}
        output_files: {type: array, items: {$ref: '#/components/schemas/RemoteFile'}}
        outputs_collected: {type: boolean}
        terminated: {type: boolean}
        observed_at: {type: string, format: date-time}
    RemoteExecutionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RemoteExecution'}}
    RemotePlanFeedback:
      type: object
      additionalProperties: false
      required: [feedback]
      properties:
        feedback: {type: string, minLength: 1, maxLength: 16384}
