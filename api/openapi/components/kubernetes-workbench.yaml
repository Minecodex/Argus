{
  "components": {
    "schemas": {
      "KubernetesInventoryDefinition": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024
          },
          "group": {
            "type": "string",
            "minLength": 0,
            "maxLength": 253
          },
          "version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "resource": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "kind": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "namespaced": {
            "type": "boolean"
          },
          "category": {
            "type": "string",
            "minLength": 0,
            "maxLength": 40
          },
          "manage_permission": {
            "type": "string",
            "minLength": 0,
            "maxLength": 100
          }
        },
        "required": [
          "key",
          "group",
          "version",
          "resource",
          "kind",
          "namespaced",
          "category",
          "manage_permission"
        ]
      },
      "KubernetesNamespaceReference": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "uid": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "name",
          "uid",
          "version"
        ]
      },
      "KubernetesInventoryScope": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "cluster_id": {
            "type": "string",
            "format": "uuid"
          },
          "cluster_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "cluster_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "cluster_wide": {
            "type": "boolean"
          },
          "namespaces": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "$ref": "#/components/schemas/KubernetesNamespaceReference"
            }
          }
        },
        "required": [
          "cluster_id",
          "cluster_name",
          "cluster_version",
          "cluster_wide",
          "namespaces"
        ]
      },
      "KubernetesInventoryObject": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "definition": {
            "$ref": "#/components/schemas/KubernetesInventoryDefinition"
          },
          "uid": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "namespace": {
            "type": "string",
            "minLength": 0,
            "maxLength": 253
          },
          "namespace_uid": {
            "type": "string",
            "minLength": 0,
            "maxLength": 128
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "resource_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "generation": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "labels": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "owners": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "apiVersion": {
                  "type": "string",
                  "minLength": 0,
                  "maxLength": 253
                },
                "kind": {
                  "type": "string",
                  "minLength": 0,
                  "maxLength": 100
                },
                "name": {
                  "type": "string",
                  "minLength": 0,
                  "maxLength": 253
                },
                "uid": {
                  "type": "string",
                  "minLength": 0,
                  "maxLength": 128
                },
                "controller": {
                  "type": "boolean"
                },
                "blockOwnerDeletion": {
                  "type": "boolean"
                }
              },
              "required": [
                "apiVersion",
                "kind",
                "name",
                "uid"
              ]
            }
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "redacted": {
            "type": "boolean"
          },
          "data": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "definition",
          "uid",
          "namespace",
          "name",
          "resource_version",
          "generation",
          "labels",
          "owners",
          "created_at",
          "observed_at",
          "redacted",
          "data"
        ]
      },
      "KubernetesInventoryPage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 200,
            "items": {
              "$ref": "#/components/schemas/KubernetesInventoryObject"
            }
          },
          "next_cursor": {
            "type": "string",
            "minLength": 0,
            "maxLength": 32768
          },
          "complete": {
            "type": "boolean"
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "scope_signature": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64
          },
          "namespace_references": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "format": "uuid"
            }
          },
          "watch_token": {
            "type": "string",
            "minLength": 1,
            "maxLength": 32768
          }
        },
        "required": [
          "items",
          "complete",
          "observed_at",
          "scope_signature",
          "namespace_references"
        ]
      },
      "KubernetesInventoryTypes": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "$ref": "#/components/schemas/KubernetesInventoryDefinition"
            }
          },
          "complete": {
            "type": "boolean"
          },
          "unavailable_reason": {
            "type": "string",
            "minLength": 0,
            "maxLength": 100
          }
        },
        "required": [
          "items",
          "complete"
        ]
      },
      "KubernetesInventoryWatchInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "token": {
            "type": "string",
            "minLength": 1,
            "maxLength": 32768
          }
        },
        "required": [
          "token"
        ]
      },
      "KubernetesInventoryWatchEvent": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "ADDED",
              "MODIFIED",
              "DELETED"
            ]
          },
          "object": {
            "$ref": "#/components/schemas/KubernetesInventoryObject"
          }
        },
        "required": [
          "type",
          "object"
        ]
      },
      "KubernetesInventoryWatchResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "events": {
            "type": "array",
            "maxItems": 200,
            "items": {
              "$ref": "#/components/schemas/KubernetesInventoryWatchEvent"
            }
          },
          "watch_token": {
            "type": "string",
            "minLength": 1,
            "maxLength": 32768
          },
          "scope_signature": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "more": {
            "type": "boolean"
          }
        },
        "required": [
          "events",
          "watch_token",
          "scope_signature",
          "observed_at",
          "more"
        ]
      },
      "KubernetesObjectVersionReference": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "uid",
          "resource_version"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "uid": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "resource_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          }
        }
      },
      "KubernetesRollbackReference": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "uid",
          "resource_version",
          "revision"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "uid": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "resource_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "revision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "KubernetesMutationInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "namespace_id": {
            "type": "string",
            "format": "uuid"
          },
          "operation": {
            "type": "string",
            "enum": [
              "create",
              "patch",
              "delete",
              "scale",
              "restart",
              "rollback",
              "cordon",
              "uncordon",
              "drain"
            ]
          },
          "type": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "uid": {
            "type": "string",
            "minLength": 0,
            "maxLength": 128
          },
          "expected_resource_version": {
            "type": "string",
            "minLength": 0,
            "maxLength": 256
          },
          "object": {
            "type": "object",
            "additionalProperties": true
          },
          "replicas": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 10000
          },
          "rollback": {
            "$ref": "#/components/schemas/KubernetesRollbackReference"
          },
          "cronjob_source": {
            "$ref": "#/components/schemas/KubernetesObjectVersionReference"
          },
          "secret_values": {
            "type": "object",
            "maxProperties": 128,
            "additionalProperties": {
              "type": "string",
              "maxLength": 65536
            },
            "writeOnly": true,
            "description": "Protected Secret values; excluded from public manifests, action plans and Agent inputs."
          }
        },
        "required": [
          "operation",
          "type",
          "name"
        ]
      },
      "KubernetesOperation": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "cluster_id": {
            "type": "string",
            "format": "uuid"
          },
          "namespace_id": {
            "type": "string",
            "format": "uuid"
          },
          "namespace_uid": {
            "type": "string",
            "minLength": 0,
            "maxLength": 128
          },
          "status": {
            "type": "string",
            "enum": [
              "awaiting_confirmation",
              "queued",
              "running",
              "observing",
              "succeeded",
              "failed",
              "cancelled",
              "result_unknown"
            ]
          },
          "operation": {
            "type": "string",
            "minLength": 1,
            "maxLength": 32
          },
          "type": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "uid": {
            "type": "string",
            "minLength": 0,
            "maxLength": 128
          },
          "error_code": {
            "type": "string",
            "minLength": 0,
            "maxLength": 128
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "result": {
            "type": "object",
            "additionalProperties": true,
            "properties": {
              "drain": {
                "$ref": "#/components/schemas/KubernetesDrainProgress"
              }
            }
          },
          "pending_action_id": {
            "type": "string",
            "format": "uuid"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "started_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "cluster_id",
          "namespace_uid",
          "status",
          "operation",
          "type",
          "name",
          "uid",
          "error_code",
          "version",
          "result",
          "created_at",
          "updated_at"
        ]
      },
      "KubernetesOperationPage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 200,
            "items": {
              "$ref": "#/components/schemas/KubernetesOperation"
            }
          },
          "next_cursor": {
            "type": "string",
            "minLength": 0,
            "maxLength": 32768
          }
        },
        "required": [
          "items"
        ]
      },
      "KubernetesDrainVolume": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "kind",
          "local"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "kind": {
            "type": "string"
          },
          "local": {
            "type": "boolean"
          },
          "claim": {
            "type": "string"
          },
          "claim_uid": {
            "type": "string"
          },
          "volume": {
            "type": "string"
          },
          "volume_uid": {
            "type": "string"
          }
        }
      },
      "KubernetesDrainBudget": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "uid",
          "disruptions_allowed"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "uid": {
            "type": "string"
          },
          "disruptions_allowed": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "KubernetesDrainPod": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "namespace_uid",
          "name",
          "uid",
          "state",
          "volumes",
          "budgets"
        ],
        "properties": {
          "namespace": {
            "type": "string"
          },
          "namespace_uid": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "uid": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "pending",
              "gone",
              "terminating",
              "eviction_requested",
              "blocked",
              "skipped"
            ]
          },
          "volumes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/KubernetesDrainVolume"
            }
          },
          "budgets": {
            "type": "array",
            "maxItems": 200,
            "items": {
              "$ref": "#/components/schemas/KubernetesDrainBudget"
            }
          }
        }
      },
      "KubernetesDrainProgress": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "phase",
          "pods"
        ],
        "properties": {
          "phase": {
            "type": "string",
            "enum": [
              "draining",
              "blocked",
              "complete"
            ]
          },
          "pods": {
            "type": "array",
            "maxItems": 200,
            "items": {
              "$ref": "#/components/schemas/KubernetesDrainPod"
            }
          }
        }
      },
      "KubernetesDrainCancelInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expected_version"
        ],
        "properties": {
          "expected_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      }
    }
  }
}
