openapi: 3.1.0
info: {title: Argus Enterprise Authorization API, version: 1.0.0, license: {name: Proprietary, identifier: LicenseRef-Proprietary}}
servers: [{url: /api/v1}]
security: [{sessionCookie: []}]
paths:
  /enterprise/permissions: {$ref: ../argus.yaml#/paths/~1enterprise~1permissions}
  /enterprise/roles: {$ref: ../argus.yaml#/paths/~1enterprise~1roles}
  "/enterprise/roles/{id}":
    $ref: "../argus.yaml#/paths/~1enterprise~1roles~1{id}"
  /enterprise/role-bindings: {$ref: ../argus.yaml#/paths/~1enterprise~1role-bindings}
  "/enterprise/role-bindings/{id}":
    $ref: "../argus.yaml#/paths/~1enterprise~1role-bindings~1{id}"
  "/enterprise/users/{id}/role-assignments":
    $ref: "../argus.yaml#/paths/~1enterprise~1users~1{id}~1role-assignments"
  "/enterprise/data-authorizations/{subject_type}/{subject_id}":
    $ref: ../paths/enterprise-data-authorization.yaml#/resources

components:
  securitySchemes:
    sessionCookie: {$ref: ../argus.yaml#/components/securitySchemes/sessionCookie}
  schemas:
    PermissionPage: {$ref: ../components/m2.yaml#/components/schemas/PermissionPage}
    RoleCreate: {$ref: ../components/m2.yaml#/components/schemas/RoleCreate}
    RoleUpdate: {$ref: ../components/m2.yaml#/components/schemas/RoleUpdate}
    RolePage: {$ref: ../components/m2.yaml#/components/schemas/RolePage}
    RoleBindingCreate: {$ref: ../components/m2.yaml#/components/schemas/RoleBindingCreate}
    RoleBindingUpdate: {$ref: ../components/m2.yaml#/components/schemas/RoleBindingUpdate}
    RoleBindingPage: {$ref: ../components/m2.yaml#/components/schemas/RoleBindingPage}
    UserRoleAssignments: {$ref: ../components/m2.yaml#/components/schemas/UserRoleAssignments}
    UserRoleAssignmentsUpdate: {$ref: ../components/m2.yaml#/components/schemas/UserRoleAssignmentsUpdate}
    DataAuthorizationSubjectType: {$ref: ../components/data-authorization.yaml#/components/schemas/DataAuthorizationSubjectType}
    DataAuthorizationResourceType: {$ref: ../components/data-authorization.yaml#/components/schemas/DataAuthorizationResourceType}
    DataAuthorizationResource: {$ref: ../components/data-authorization.yaml#/components/schemas/DataAuthorizationResource}
    DataAuthorizationPage: {$ref: ../components/data-authorization.yaml#/components/schemas/DataAuthorizationPage}
    DataAuthorizationBatch: {$ref: ../components/data-authorization.yaml#/components/schemas/DataAuthorizationBatch}
