        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "watchKubernetesInventory",
      "summary": "Watch the current page with frozen UID scope and bounded batches",
      "tags": [
        "Kubernetes"
      ],
      "parameters": [
        {
          "$ref": "../argus.yaml#/components/parameters/CsrfToken"
