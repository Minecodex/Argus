          "application/json": {
            "schema": {
              "$ref": "../components/kubernetes-workbench.yaml#/components/schemas/KubernetesInventoryWatchInput"
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "Bounded events and next authorized resume token",
