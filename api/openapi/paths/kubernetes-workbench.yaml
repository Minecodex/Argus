{
  "inventory": {
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "get": {
      "operationId": "listKubernetesInventory",
      "summary": "List authorized Kubernetes objects with server pagination",
      "tags": [
        "Kubernetes"
      ],
      "parameters": [
        {
          "name": "type",
          "in": "query",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024
          }
        },
        {
          "name": "namespace_mode",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "enum": [
              "all_authorized",
              "explicit"
            ],
            "default": "all_authorized"
          }
        },
        {
          "name": "namespace_ids",
          "in": "query",
          "required": false,
          "schema": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "style": "form",
          "explode": false
        },
        {
          "name": "name",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "minLength": 0,
            "maxLength": 253
          }
        },
        {
          "name": "labels",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "minLength": 0,
            "maxLength": 1024
          }
        },
        {
          "name": "limit",
          "in": "query",
          "required": false,
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 50
          }
        },
        {
          "name": "cursor",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "minLength": 0,
            "maxLength": 32768
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Authorized UID-bound Kubernetes observation",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/kubernetes-workbench.yaml#/components/schemas/KubernetesInventoryPage"
              }
            }
          }
        },
        "default": {
          "$ref": "./dashboard.yaml#/components/responses/Error"
        }
      }
    }
  },
  "object": {
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "get": {
      "operationId": "getKubernetesInventoryObject",
      "summary": "Read a projected object with frozen UID",
      "tags": [
        "Kubernetes"
      ],
      "parameters": [
        {
          "name": "type",
          "in": "query",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024
          }
        },
        {
          "name": "name",
          "in": "query",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          }
        },
        {
          "name": "uid",
          "in": "query",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        },
        {
          "name": "namespace_id",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Authorized UID-bound Kubernetes observation",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/kubernetes-workbench.yaml#/components/schemas/KubernetesInventoryObject"
              }
            }
          }
        },
        "default": {
          "$ref": "./dashboard.yaml#/components/responses/Error"
        }
      }
    }
  },
