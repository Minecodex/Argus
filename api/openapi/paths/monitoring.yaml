{
  "applications": {
    "get": {
      "operationId": "listMonitoringApplications",
      "summary": "Search authorized single-environment applications",
      "tags": [
        "Monitoring"
      ],
      "parameters": [
        {
          "name": "search",
          "in": "query",
          "schema": {
            "type": "string",
            "minLength": 0,
            "maxLength": 200
          }
        },
        {
          "name": "cursor",
          "in": "query",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          }
        },
        {
          "name": "limit",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 50
          }
        },
        {
          "name": "status",
          "in": "query",
          "schema": {
            "type": "string",
            "enum": [
              "active",
              "archived"
            ],
            "default": "active"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Authorized monitoring workspace result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/monitoring.yaml#/components/schemas/MonitoringApplicationPage"
              }
            }
          }
        },
        "default": {
          "$ref": "./dashboard.yaml#/components/responses/Error"
        }
      }
    }
  },
  "application": {
    "parameters": [
      {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "get": {
      "operationId": "getMonitoringApplication",
      "summary": "Read an authorized application",
      "tags": [
        "Monitoring"
      ],
      "responses": {
        "200": {
          "description": "Authorized monitoring workspace result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/monitoring.yaml#/components/schemas/MonitoringApplication"
              }
            }
          }
        },
        "default": {
          "$ref": "./dashboard.yaml#/components/responses/Error"
        }
      }
    }
  },
  "services": {
    "get": {
      "operationId": "listMonitoringServices",
      "summary": "Search services within authorized applications",
      "tags": [
        "Monitoring"
      ],
      "parameters": [
        {
          "name": "search",
          "in": "query",
          "schema": {
            "type": "string",
            "minLength": 0,
            "maxLength": 200
          }
        },
        {
          "name": "cursor",
          "in": "query",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          }
        },
        {
          "name": "limit",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 50
          }
        },
        {
          "name": "application_ids",
          "in": "query",
          "style": "form",
          "explode": false,
          "schema": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          }
        },
        {
          "name": "application_mode",
          "in": "query",
          "description": "explicit preserves an empty application_ids set; all_authorized enumerates current grants",
          "schema": {
            "type": "string",
            "enum": [
              "all_authorized",
              "explicit"
            ]
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Authorized monitoring workspace result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/monitoring.yaml#/components/schemas/MonitoringServicePage"
              }
            }
          }
        },
        "default": {
          "$ref": "./dashboard.yaml#/components/responses/Error"
        }
      }
    }
  },
  "preview": {
    "post": {
      "operationId": "previewMonitoringCommand",
      "summary": "Preview an immutable monitoring workspace change",
      "tags": [
        "Monitoring"
      ],
      "parameters": [
        {
          "$ref": "../argus.yaml#/components/parameters/IdempotencyKey"
        },
        {
          "$ref": "../argus.yaml#/components/parameters/CsrfToken"
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../components/monitoring.yaml#/components/schemas/MonitoringMutation"
            }
          }
        }
      },
      "responses": {
        "201": {
          "description": "Existing PendingAction confirmation workflow",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/alerts.yaml#/components/schemas/PendingActionPublic"
              }
            }
          }
        },
        "default": {
          "$ref": "./dashboard.yaml#/components/responses/Error"
        }
      }
    }
  },
  "collections": {
    "get": {
      "operationId": "listMonitoringCollections",
      "summary": "Search and filter authorized collections before pagination",
      "tags": [
        "Monitoring"
      ],
      "parameters": [
        {
          "name": "desired_enabled",
          "in": "query",
          "description": "Omit for both states; false explicitly selects disabled collections.",
          "schema": { "type": "boolean" }
        },
        {
          "name": "apply_status",
          "in": "query",
          "schema": {
            "type": "string",
            "enum": ["pending", "applying", "effective", "failed", "unknown"]
          }
        },
        {
          "name": "health",
          "in": "query",
          "schema": {
            "type": "string",
            "enum": ["unknown", "healthy", "degraded", "failed", "stopped"]
          }
        },
        {
          "name": "freshness",
          "in": "query",
          "description": "Uses the same three-interval / two-minute sample freshness threshold as collection rows.",
          "schema": {
            "type": "string",
            "enum": ["no_data", "fresh", "stale"]
          }
        },
        {
          "name": "search",
          "in": "query",
          "schema": {
            "type": "string",
            "minLength": 0,
            "maxLength": 200
          }
        },
        {
          "name": "cursor",
          "in": "query",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          }
        },
        {
          "name": "limit",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 50
          }
        },
        {
          "name": "integration",
          "in": "query",
          "schema": {
            "type": "string",
            "minLength": 0,
            "maxLength": 64
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Authorized monitoring workspace result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/monitoring.yaml#/components/schemas/MonitoringCollectionPage"
              }
            }
          }
        },
        "default": {
          "$ref": "./dashboard.yaml#/components/responses/Error"
        }
      }
    }
  },
