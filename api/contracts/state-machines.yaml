version: argus.state_machines/v1
machines:
  pending_action_token:
    initial: active
    terminal: [consumed, revoked, expired]
    transitions:
      active: [consumed, revoked, expired]
      consumed: []
      revoked: []
      expired: []
  pending_action:
    initial: prepared
    terminal: [succeeded, failed, cancelled, expired, rejected, invalidated]
    transitions:
      prepared: [awaiting_confirmation]
      awaiting_confirmation: [awaiting_approval, ready, executing, cancelled, expired, invalidated]
      awaiting_approval: [ready, rejected, cancelled, expired, invalidated]
      ready: [executing, cancelled, expired, invalidated]
      executing: [succeeded, failed, result_unknown]
      result_unknown: [succeeded, failed]
  action_binding:
    initial: pending
    terminal: [consumed, cancelled, expired, invalidated]
    transitions:
      pending: [consumed, cancelled, expired, invalidated]
  approval_request:
    initial: pending
    terminal: [approved, rejected, expired, invalidated]
    transitions:
      pending: [approved, rejected, expired, invalidated]
  execution:
    initial: pending
    terminal: [succeeded, failed, cancelled]
    transitions:
      pending: [running, cancelled]
      running: [succeeded, failed, result_unknown, cancelled]
      result_unknown: [succeeded, failed]
  context_snapshot:
    initial: pending
    terminal: [failed, superseded]
    transitions:
      pending: [active, failed]
      active: [superseded]
  platform_state:
    initial: uninitialized
    terminal: [initialized]
    transitions:
      uninitialized: [initializing]
      initializing: [uninitialized, initialized]
      initialized: []
  session:
    initial: active
    terminal: [expired, revoked]
    transitions:
      active: [expired, revoked]
      expired: []
      revoked: []
  temporary_credential:
    initial: active
    terminal: [consumed, expired, revoked]
    transitions:
      active: [consumed, expired, revoked]
      consumed: []
      expired: []
      revoked: []
  api_key:
    initial: active
    terminal: [revoked, expired]
    transitions:
      active: [revoked, expired]
      revoked: []
      expired: []
  enterprise:
    initial: active
    terminal: [disabled]
    transitions:
      active: [suspended, disabled]
      suspended: [active, disabled]
      disabled: []
  secret:
    initial: active
    terminal: []
    transitions:
      active: [disabled]
      disabled: [active]
  connector_certificate:
    initial: active
    terminal: [revoked, expired]
    transitions:
      active: [overlap, revoked, expired]
      overlap: [revoked, expired]
      revoked: []
      expired: []
  connector_enrollment_token:
    initial: active
    terminal: [consumed, revoked, expired]
    transitions:
      active: [consumed, revoked, expired]
      consumed: []
      revoked: []
      expired: []
  connector:
    initial: pending
    terminal: [uninstalled, revoked]
    transitions:
      pending: [online, offline, revoked]
      online: [suspected_offline, draining, uninstalled, revoked]
      suspected_offline: [online, offline, uninstalled, revoked]
      offline: [online, uninstalled, revoked]
      draining: [offline, uninstalled, revoked]
      uninstalled: []
      revoked: []
  connector_command:
    initial: queued
    terminal: [succeeded, failed, timed_out, expired]
    transitions:
      queued: [dispatched, delivery_unknown, expired]
      dispatched: [acknowledged, delivery_unknown, timed_out]
      acknowledged: [running, failed, timed_out, result_unknown]
      running: [succeeded, failed, timed_out, result_unknown]
      delivery_unknown: [acknowledged, running, succeeded, failed, result_unknown]
      result_unknown: [succeeded, failed]
      succeeded: []
      failed: []
      timed_out: []
      expired: []
  host_onboarding_operation:
    initial: queued
    terminal: [succeeded, failed, expired]
    transitions:
      queued: [running, failed, expired]
      running: [succeeded, failed, result_unknown, expired]
      result_unknown: [succeeded, failed, expired]
      succeeded: []
      failed: []
      expired: []
  host_onboarding_stage:
    initial: queued
    terminal: [completed]
    transitions:
      queued: [probing]
      probing: [transferring]
      transferring: [installing]
      installing: [enrolling]
      enrolling: [waiting_online]
      waiting_online: [completed]
      completed: []
  host_removal_operation:
    initial: queued
    terminal: [succeeded]
    transitions:
      queued: [running, awaiting_manual_execution, failed]
      awaiting_manual_execution: [running, failed, cleanup_unknown]
      running: [succeeded, failed, cleanup_unknown]
      failed: [queued, awaiting_manual_execution]
      cleanup_unknown: [queued, awaiting_manual_execution, succeeded]
      succeeded: []
  host_removal_stage:
    initial: queued
    terminal: [completed]
    transitions:
      queued: [draining, terminating_sessions, awaiting_manual_execution]
      draining: [terminating_sessions]
      terminating_sessions: [awaiting_manual_execution, uninstalling_workloads, revoking_identities]
      awaiting_manual_execution: [uninstalling_workloads]
      uninstalling_workloads: [stopping_relay, uninstalling_connector]
      stopping_relay: [uninstalling_connector]
      uninstalling_connector: [verifying_cleanup]
      verifying_cleanup: [revoking_identities]
      revoking_identities: [completed]
      completed: []
  connection_test:
    initial: queued
    terminal: [succeeded, failed, result_unknown, expired]
    transitions:
      queued: [running, failed, expired]
      running: [succeeded, failed, result_unknown, expired]
      succeeded: []
      failed: []
      result_unknown: []
      expired: []
  bastion_scope:
    initial: pending
    terminal: [deleted]
    transitions:
      pending: [active, offline, deleted]
      active: [suspected_offline, offline, draining]
      suspected_offline: [active, offline, draining]
      offline: [active, draining, deleted]
      draining: [uninstalling, removal_failed, cleanup_unknown]
      uninstalling: [uninstalled, removal_failed, cleanup_unknown]
      removal_failed: [draining, deleted]
      cleanup_unknown: [draining, uninstalled, deleted]
      uninstalled: [deleted]
      deleted: []
