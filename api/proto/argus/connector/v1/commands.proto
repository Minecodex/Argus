syntax = "proto3";

package argus.connector.v1;

option go_package = "github.com/kakj-go/Argus/internal/gen/proto/argus/connector/v1;connectorv1";

import "argus/common/v1/common.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

message ConnectorCommand {
  string command_id = 1;
  uint64 connection_epoch = 2;
  string command_type = 3;
  bytes payload = 4 [deprecated = true];
  string payload_hash = 5;
  google.protobuf.Timestamp expires_at = 6;
  string idempotency_key = 7;
  google.protobuf.Any typed_payload = 8;
  string payload_schema_version = 9;
  string operation_ref = 10;
  string credential_lease_id = 11;
}

message CommandResult {
  string command_id = 1;
  uint64 connection_epoch = 2;
  string status = 3;
  bytes result = 4 [deprecated = true];
  string result_hash = 5;
  argus.common.v1.ErrorStatus error = 6;
  google.protobuf.Any typed_result = 7;
  string result_schema_version = 8;
}

message HostConnectionProbe {
  string address = 1;
  uint32 port = 2;
  string protocol = 3;
  string expected_host_key_fingerprint = 4;
  string username = 5;
  string platform = 6;
  CallbackProbePlan onboarding = 7;
}

message CallbackProbePlan {
  string control_path = 1;
  string enrollment_endpoint = 2;
  string gateway_endpoint = 3;
  string enroll_dial_address = 4;
  string gateway_dial_address = 5;
  bytes trust_bundle_pem = 6;
  int64 trust_bundle_epoch = 7;
  int64 relay_port_generation = 8;
}

message HostConnectionProbeResult {
  repeated string resolved_ips = 1;
  string host_key_fingerprint = 2;
  string platform = 3;
  string remote_version = 4;
  uint64 latency_millis = 5;
  // Normalized uname -m value. Linux probes must return amd64 or arm64 so
  // signed installation artifacts can be frozen during ConnectionTest.
  string architecture = 6;
  string distribution_version = 7;
  string service_manager = 8;
  bool privileged = 9;
  uint64 free_disk_bytes = 10;
  bool callback_verified = 11;
  string callback_control_path = 12;
}

message KubernetesConnectionProbe {
  string api_server = 1;
  string default_namespace = 2;
}

message KubernetesConnectionProbeResult {
  string server_version = 1;
  uint32 node_count = 2;
  uint32 ready_node_count = 3;
  repeated string namespaces = 4;
}

message KubernetesResourceQuery {
  string cluster_id = 1;
  string resource_type = 2;
  string namespace = 3;
  string name = 4;
  string label_selector = 5;
  uint32 limit = 6;
  string continue_token = 7;
  uint32 max_result_bytes = 8;
}

message KubernetesResourceQueryResult {
  repeated bytes resources_json = 1;
  string continue_token = 2;
  bool truncated = 3;
}

message KubernetesPodLogsQuery {
  string cluster_id = 1;
  string namespace = 2;
  string pod = 3;
  string container = 4;
  uint32 tail_lines = 5;
  uint32 max_result_bytes = 6;
}

message KubernetesPodLogsResult {
  bytes content = 1;
  bool truncated = 2;
}

message ConnectorUninstall {
  string connector_id = 1;
  string bastion_scope_id = 2;
  uint64 expected_connection_epoch = 3;
  uint64 fencing_generation = 4;
}

message ConnectorUninstallResult {
  bool identity_removed = 1;
  bool service_stopped = 2;
}

message HostConnectorRemoval {
  string operation_id = 1;
  string host_id = 2;
  string connector_id = 3;
  uint64 removal_generation = 4;
  string target_platform = 5;
  string address = 6;
  uint32 port = 7;
  string username = 8;
  string pinned_host_key = 9;
  string managed_change_id = 10;
  bytes managed_change_before_json = 11;
  bytes managed_change_applied_json = 12;
}

message HostConnectorRemovalResult {
  string operation_id = 1;
  bytes cleanup_hash = 2;
  bool local_cleanup_verified = 3;
  bool local_config_drift = 4;
  bytes cleanup_evidence_json = 5;
}

message HostWindowsRDPConfigure {
  string host_id = 1;
  bool enable = 2;
  bool enforce_nla = 3;
  bool enable_firewall = 4;
}

message HostWindowsRDPConfigureResult {
  string host_id = 1;
  string rdp_status = 2;
  bool nla_enabled = 3;
  bool firewall_enabled = 4;
  bool service_running = 5;
  bytes before_state_json = 6;
  bytes applied_state_json = 7;
}
