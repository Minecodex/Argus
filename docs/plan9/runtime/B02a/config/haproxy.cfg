global
    log /dev/log local0
    maxconn 128
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
defaults
    log global
    mode http
    timeout connect 1s
    timeout client 25s
    timeout server 25s
    retries 1
frontend web
    bind *:8083
    default_backend application
backend application
    option httpchk GET /health
    server app 127.0.0.1:9001 check inter 1s fall 2 rise 2
listen statistics
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
