ServerName plan9-web-lab
ExtendedStatus On
<VirtualHost *:8082>
    ServerName plan9-web-lab
    ProxyPass /server-status !
    <Location /server-status>
        SetHandler server-status
        Require all granted
    </Location>
    ProxyPass / http://127.0.0.1:9000/ timeout=25
    ProxyPassReverse / http://127.0.0.1:9000/
    ErrorLog ${APACHE_LOG_DIR}/plan9-error.log
    CustomLog ${APACHE_LOG_DIR}/plan9-access.log combined
</VirtualHost>
