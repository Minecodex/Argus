[unix_http_server]
file=/run/plan9/supervisor.sock
chmod=0600
[supervisord]
nodaemon=true
user=root
pidfile=/run/plan9/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/plan9/supervisor.sock
[program:http]
command=/usr/bin/python3 /usr/local/bin/plan9-probe-services http
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:tcp]
command=/usr/bin/python3 /usr/local/bin/plan9-probe-services tcp
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:tls]
command=/usr/bin/python3 /usr/local/bin/plan9-probe-services tls
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:dns]
command=/usr/sbin/dnsmasq --no-daemon --user=root --group=root --no-resolv --no-hosts --port=5353 --local=/b02b.test/ --addn-hosts=/var/lib/plan9/dns-hosts --cache-size=0 --pid-file=/run/plan9/dns.pid
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
