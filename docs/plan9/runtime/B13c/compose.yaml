name: ${PLAN9_RUN:?Run required}
x-labels: &labels {io.argus.plan9.run: '${PLAN9_RUN}', io.argus.plan9.batch: B13c}
x-logging: &logging {driver: json-file, options: {max-size: 5m, max-file: '2'}}
x-host: &host
  image: ${PLAN9_HOST_IMAGE:?Pinned host required}
  privileged: true
  cgroup: private
  cpus: 1
  mem_limit: 1024m
  memswap_limit: 1024m
  pids_limit: 512
  restart: unless-stopped
  tmpfs: [/run:size=64m, /run/lock:size=8m, /tmp:size=128m]
  networks: [lab, kind]
  extra_hosts: ['host.docker.internal:host-gateway']
  labels: *labels
  logging: *logging
  healthcheck:
    test: [CMD-SHELL, 'systemctl is-active --quiet ssh dbus plan9-b13c.service && curl -fsS http://127.0.0.1:18085/health']
    interval: 5s
    timeout: 3s
    retries: 24
services:
  orders:
    <<: *host
    hostname: ${PLAN9_RUN}-orders
    environment: {PLAN9_RUN: '${PLAN9_RUN}', PLAN9_PEER: orders}
    volumes: ['orders-state:/var/lib/plan9', 'orders-journal:/var/log/journal', '${PLAN9_PRIVATE}/redis-credentials.json:/etc/plan9/redis.json:ro', '${PLAN9_PRIVATE}/orders.env:/etc/plan9-app.env:ro']
    ports: ['127.0.0.1:22411:22']
    depends_on: {redis: {condition: service_healthy}}
  reports:
    <<: *host
    hostname: ${PLAN9_RUN}-reports
    environment: {PLAN9_RUN: '${PLAN9_RUN}', PLAN9_PEER: reports}
    volumes: ['reports-state:/var/lib/plan9', 'reports-journal:/var/log/journal', '${PLAN9_PRIVATE}/redis-credentials.json:/etc/plan9/redis.json:ro', '${PLAN9_PRIVATE}/reports.env:/etc/plan9-app.env:ro']
    ports: ['127.0.0.1:22412:22']
    depends_on: {redis: {condition: service_healthy}, memcached: {condition: service_healthy}}
  redis:
    image: ${PLAN9_REDIS_IMAGE:?Pinned Redis required}
    cpus: 0.5
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 96
    restart: unless-stopped
    command: [redis-server, /run/secrets/redis.conf]
    volumes: ['redis-data:/data', '${PLAN9_PRIVATE}/redis.conf:/run/secrets/redis.conf:ro', '${PLAN9_PRIVATE}/users.acl:/run/secrets/users.acl:ro']
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -Eq "PONG|NOAUTH"']
      interval: 5s
      timeout: 3s
      retries: 20
    labels: *labels
    logging: *logging
  memcached:
    image: ${PLAN9_MEMCACHED_IMAGE:?Pinned Memcached required}
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    command: [memcached, -m, '8', -c, '64', -t, '1', -I, 1m, -U, '0']
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, 'printf "version\r\n" | nc -w 1 127.0.0.1 11211 | grep -q VERSION']
      interval: 5s
      timeout: 3s
      retries: 20
    labels: *labels
    logging: *logging
networks:
  lab: {labels: *labels}
  kind: {external: true, name: kind}
volumes:
  orders-state: {labels: *labels}
  orders-journal: {labels: *labels}
  reports-state: {labels: *labels}
  reports-journal: {labels: *labels}
  redis-data: {labels: *labels}
