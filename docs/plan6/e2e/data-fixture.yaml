apiVersion: v1
kind: Namespace
metadata:
  name: argus-plan6-data-e2e-20261008
  labels: {argus.io/plan6-owned: "20261008"}
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: argus-plan6-data-e2e-20261008
  labels: {app: plan6-postgres}
spec:
  containers:
    - name: postgres
      image: postgres:18.6-alpine
      imagePullPolicy: IfNotPresent
      env:
        - {name: POSTGRES_USER, value: plan6}
        - {name: POSTGRES_DB, value: plan6}
        - {name: POSTGRES_PASSWORD, value: disposable-plan6-fixture}
      ports: [{containerPort: 5432}]
      resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
      readinessProbe: {exec: {command: [pg_isready, -U, plan6]}, periodSeconds: 2}
      volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
  volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: argus-plan6-data-e2e-20261008}
spec:
  selector: {app: plan6-postgres}
  ports: [{port: 5432, targetPort: 5432}]
