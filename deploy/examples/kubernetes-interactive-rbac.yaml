# Optional permissions for an existing Connector identity, in ONE target
# namespace. Replace both namespaces before applying. The installer remains
# read-only; granting these API permissions does not grant Argus users access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-interactive-sessions
  namespace: TARGET_NAMESPACE
rules:
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-interactive-sessions
  namespace: TARGET_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-interactive-sessions
subjects:
  - kind: ServiceAccount
    name: argus-kubernetes-connector
    namespace: CONNECTOR_NAMESPACE
