{{- $seen := dict }}
{{- range $key := list "system" "sandbox" "observability" }}
{{- $namespace := index $.Values.namespaces $key }}
{{- if not (hasKey $seen $namespace) }}
{{- $_ := set $seen $namespace true }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    app.kubernetes.io/part-of: argus
    argus.io/release-id: {{ $.Values.releaseId | quote }}
    argus.io/plane: {{ $key | quote }}
{{- end }}
{{- end }}
