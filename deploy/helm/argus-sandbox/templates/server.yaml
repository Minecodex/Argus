apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-opensandbox-config
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
data:
  config.toml: |
    {{- .Values.serverConfig | nindent 4 }}
  batchsandbox.yaml: |
    apiVersion: sandbox.opensandbox.io/v1alpha1
    kind: BatchSandbox
    metadata:
      labels: {app.kubernetes.io/part-of: argus}
    spec:
      replicas: 1
      template:
        metadata:
          labels: {app.kubernetes.io/part-of: argus}
        spec:
          automountServiceAccountToken: false
          {{- if .Values.runtimeClassName }}
          runtimeClassName: {{ .Values.runtimeClassName }}
          {{- end }}
          restartPolicy: Never
          containers: []
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensandbox-server
rules:
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes, batchsandboxes/status, batchsandboxes/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/status, events, services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensandbox-server
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: opensandbox-server}
subjects: [{kind: ServiceAccount, name: opensandbox-server}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-server
  labels: {app.kubernetes.io/part-of: argus, argus.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: opensandbox-server}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opensandbox-server, app.kubernetes.io/part-of: argus}
      annotations: {checksum/config: {{ .Values.serverConfig | sha256sum | quote }}}
    spec:
      serviceAccountName: opensandbox-server
      containers:
        - name: server
          image: opensandbox/server:v0.2.2
          args: ["--config", "/etc/opensandbox/config.toml"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: SANDBOX_CONFIG_PATH
              value: /etc/opensandbox/config.toml
            - name: OPENSANDBOX_SERVER_API_KEY
              valueFrom: {secretKeyRef: {name: argus-opensandbox-api, key: api-key}}
          volumeMounts: [{name: config, mountPath: /etc/opensandbox, readOnly: true}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
      volumes: [{name: config, configMap: {name: argus-opensandbox-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-server
spec:
  selector: {app.kubernetes.io/name: opensandbox-server}
  ports: [{name: http, port: 80, targetPort: http}]
