apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus-web
  namespace: {{ .Values.namespaces.system }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "360"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "360"
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.hosts.enterprise }}
      secretName: argus-enterprise-tls
    - hosts: [{{ .Values.hosts.platform }}]
      secretName: argus-platform-tls
    - hosts: [{{ .Values.hosts.templates }}]
      secretName: argus-templates-tls
    {{- with .Values.hosts.artifact }}
    - hosts: [{{ . }}]
      secretName: argus-artifact-tls
    {{- end }}
  rules:
    # The remote-access WSS endpoint is served on the enterprise origin
    # (same host as the page, no dedicated terminal domain): the browser
    # reuses the page's TLS session and DNS mapping for the terminal too.
    - host: {{ .Values.hosts.enterprise }}
      http:
        paths:
          - path: /v1/sessions
            pathType: Prefix
            backend:
              service: {name: argus-connector-gateway, port: {name: remote-wss}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: enterprise}}
    - host: {{ .Values.hosts.platform }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: platform}}
    - host: {{ .Values.hosts.templates }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-web, port: {name: templates}}
    {{- with .Values.hosts.artifact }}
    # Collector 产物匿名下载源:MinIO S3 路径式 GET,完整性由产物签名保证。
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argus-minio, port: {name: api}}
    {{- end }}
